services:
  campaign-race-probe:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    working_dir: /workspace
    networks: [edge, cms-data]
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD}
    volumes: [../..:/workspace:ro]
  campaign-site:
    # This proof exercises authentication only; no object store is started.
    networks: !override [edge, cms-data]
  core-postgres:
    networks: !override [core-data, cms-data]
