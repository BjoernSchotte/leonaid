services:
  campaign-race-probe:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    working_dir: /workspace
    networks: [edge, cms-data]
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD}
    volumes: [../..:/workspace:ro]
  campaign-site:
    # This proof exercises authentication only; no object store is started.
    networks: !override [edge, cms-data]
  core-postgres:
    networks: !override [core-data, cms-data]
