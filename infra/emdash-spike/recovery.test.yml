services:
  proxy:
    ports: !reset []
  recovery-node:
    profiles: [recovery-test]
    image: docker.io/library/node:22.23.0-alpine3.23@sha256:35e2f96595091599e7c1fb0b61049e17d8478997b2aa13db51ad7995299fe55a
    working_dir: /workspace
    entrypoint: [node]
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD}
    networks: [core-data, cms-data]
    volumes:
      - ../..:/workspace:ro
      - cms-bootstrap-state:/bootstrap
      - twenty-server-data:/twenty-storage
  recovery-python:
    profiles: [recovery-test]
    image: ghcr.io/astral-sh/uv:0.11.17-python3.13-trixie-slim@sha256:6181d17d152967488408b4ced7b2930cc91c2b39adb7af6fb339965afce3404e
    working_dir: /workspace
    entrypoint: [/workspace/.venv/bin/python]
    environment:
      PYTHONPATH: /workspace
      CORE_POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD}
      TWENTY_POSTGRES_PASSWORD: ${TWENTY_POSTGRES_PASSWORD}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    networks: [core-data, cms-data, crm-data, storage-data]
    volumes:
      - ../..:/workspace:ro
      - twenty-server-data:/twenty-storage:ro
networks:
  core-data:
    ipam:
      config:
        [
          {
            subnet: "${LEONAID_RECOVERY_PREFIX:?isolated subnet required}.0/28",
          },
        ]
  cms-data:
    ipam:
      config:
        [
          {
            subnet: "${LEONAID_RECOVERY_PREFIX:?isolated subnet required}.16/28",
          },
        ]
  crm-data:
    ipam:
      config:
        [
          {
            subnet: "${LEONAID_RECOVERY_PREFIX:?isolated subnet required}.32/28",
          },
        ]
  storage-data:
    ipam:
      config:
        [
          {
            subnet: "${LEONAID_RECOVERY_PREFIX:?isolated subnet required}.48/28",
          },
        ]
