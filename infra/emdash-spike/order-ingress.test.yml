services:
  proxy:
    image: ${CADDY_IMAGE:?}
    environment:
      LEONAID_PUBLIC_DOMAIN: localhost
      TWENTY_PUBLIC_DOMAIN: crm.localhost
      CADDY_ACME_EMAIL: operator@leonaid.invalid
    volumes:
      - ${EMDASH_ORDER_INGRESS_CONFIG:?}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [proof]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test -f /data/caddy/pki/authorities/local/root.crt && wget -q -O /dev/null http://127.0.0.1/_health",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
  probe:
    image: ${NODE_IMAGE:?}
    volumes:
      - ${EMDASH_ORDER_INGRESS_ROOT:?}/tools/emdash_spike:/tools:ro
      - ${EMDASH_ORDER_INGRESS_PROOF:?}:/proof:ro
    networks: [proof]
    command: [node, /tools/order-ingress-proof.mjs, --pilot]
networks:
  proof:
    internal: true
volumes:
  caddy-data:
  caddy-config:
