services:
  proxy:
    ports: !reset []
    depends_on: !reset {}
  public:
    depends_on: !reset {}
  admin-browser:
    image: mcr.microsoft.com/playwright:v1.54.1-noble@sha256:307ace13c8ba4349f790f4dfbc6eaa9fcafdeb29c218ff36129c7cacebb1e35f
    working_dir: /workspace
    networks: [edge]
    volumes:
      - ../../tools:/workspace/tools:ro
      - ../../node_modules:/workspace/node_modules:ro
  campaign-site:
    environment:
      EMDASH_SITE_URL: https://proxy:8443
  bootstrap-probe:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    working_dir: /workspace
    networks: [edge]
    volumes:
      - ../../tools:/workspace/tools:ro
      - ../../apps/campaign-site/src/auth/campaign-manifest.mjs:/workspace/apps/campaign-site/src/auth/campaign-manifest.mjs:ro
      - ../../apps/campaign-site/src/campaign-schema.mjs:/workspace/apps/campaign-site/src/campaign-schema.mjs:ro
      - ../../specs/emdash-campaign-microsite-spike:/workspace/specs/emdash-campaign-microsite-spike:ro
  bootstrap-operator:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    user: "1000:1000"
    network_mode: none
    working_dir: /workspace
    volumes:
      - ../../apps/campaign-site:/workspace/apps/campaign-site:ro
      - ../../tools/emdash_spike:/workspace/tools/emdash_spike:ro
      - cms-bootstrap-state:/app/bootstrap-state
    entrypoint: [node, tools/emdash_spike/arm-bootstrap.mjs]
