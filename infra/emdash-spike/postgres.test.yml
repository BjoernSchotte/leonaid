services:
  core-postgres:
    image: docker.io/library/postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: leonaid
      POSTGRES_USER: leonaid
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [core-data, cms-data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U leonaid -d leonaid"]
      interval: 1s
      timeout: 3s
      retries: 30
  proof:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
    volumes:
      - ../..:/workspace:ro
    working_dir: /workspace
    networks: [cms-data]
    command: [node, tools/emdash_spike/postgres-proof.mjs]
networks:
  core-data:
    internal: true
  cms-data:
    internal: true
volumes:
  postgres-data:
