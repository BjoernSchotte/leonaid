x-database: &database
  image: docker.io/library/postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
  environment:
    POSTGRES_DB: leonaid
    POSTGRES_USER: leonaid
    POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
  networks: [proof]
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U leonaid -d leonaid"]
    interval: 1s
    timeout: 3s
    retries: 30
services:
  core-postgres:
    <<: *database
    volumes: [source-data:/var/lib/postgresql/data]
  restore-postgres:
    <<: *database
    volumes: [target-data:/var/lib/postgresql/data]
  operator:
    image: docker.io/library/node:22.23.0-alpine3.23@sha256:35e2f96595091599e7c1fb0b61049e17d8478997b2aa13db51ad7995299fe55a
    working_dir: /workspace
    entrypoint: [node]
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:?CMS secret required}
    networks: [proof]
    volumes: [../..:/workspace:ro]
networks:
  proof:
    internal: true
volumes:
  source-data:
  target-data:
