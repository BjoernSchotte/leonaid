x-database: &database
  image: docker.io/library/postgres:16.15-alpine3.24@sha256:e0e53cfa0884f3cc216a621033e4f38dceb49e52218ac77facc8e48f02973093
  environment:
    POSTGRES_DB: leonaid
    POSTGRES_USER: leonaid
    POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
  networks: [proof]
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U leonaid -d leonaid"]
    interval: 1s
    timeout: 3s
    retries: 30
services:
  core-postgres:
    <<: *database
    volumes: [source-data:/var/lib/postgresql/data]
  restore-postgres:
    <<: *database
    volumes: [target-data:/var/lib/postgresql/data]
  operator:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    working_dir: /workspace
    entrypoint: [node]
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:?CMS secret required}
    networks: [proof]
    volumes: [../..:/workspace:ro]
networks:
  proof:
    internal: true
volumes:
  source-data:
  target-data:
