x-database: &database
  image: docker.io/library/postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
  environment:
    POSTGRES_DB: leonaid
    POSTGRES_USER: leonaid
    POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
  networks: [proof]
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U leonaid -d leonaid"]
    interval: 1s
    timeout: 3s
    retries: 30
services:
  core-postgres:
    <<: *database
    volumes: [source-data:/var/lib/postgresql/data]
  restore-postgres:
    <<: *database
    volumes: [target-data:/var/lib/postgresql/data]
  operator:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    working_dir: /workspace
    entrypoint: [node]
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD:?worktree secret required}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:?CMS secret required}
    networks: [proof]
    volumes: [../..:/workspace:ro]
networks:
  proof:
    internal: true
volumes:
  source-data:
  target-data:
