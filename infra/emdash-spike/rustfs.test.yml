services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?worktree secret required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?worktree secret required}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [rustfs-data:/data]
    networks: [storage-data]
    healthcheck:
      test: [CMD, curl, --fail, "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  proof:
    image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim@sha256:e586c1c65b7071aec78f02c5587c76c5011159cd76b3d6f1255f40e48e850abc
    environment:
      PYTHONPATH: /workspace
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?worktree secret required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?worktree secret required}
    volumes: [../..:/workspace:ro]
    working_dir: /workspace
    networks: [storage-data]
    command: [uv, run, --frozen, --no-sync, python, tools/emdash_spike/rustfs_proof.py]
networks:
  storage-data:
    internal: true
volumes:
  rustfs-data:
