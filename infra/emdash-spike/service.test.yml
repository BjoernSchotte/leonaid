services:
  cms-db-operator:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    environment:
      PGHOST: core-postgres
      PGDATABASE: leonaid
      PGUSER: leonaid
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:?bootstrap CMS secrets first}
    volumes: [../..:/workspace:ro]
    working_dir: /workspace
    networks: [cms-data]
    command: [node, tools/emdash_spike/service-provision.mjs]
  cms-storage-operator:
    image: ghcr.io/astral-sh/uv:0.13.6-python3.13-trixie-slim@sha256:e586c1c65b7071aec78f02c5587c76c5011159cd76b3d6f1255f40e48e850abc
    environment:
      PYTHONPATH: /workspace:/workspace/src
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      CMS_S3_ACCESS_KEY_ID: leonaid-emdash
      CMS_S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:?bootstrap CMS secrets first}
    volumes: [../..:/workspace:ro]
    working_dir: /workspace
    networks: [storage-data]
    command:
      [
        uv,
        run,
        --frozen,
        --no-sync,
        python,
        -m,
        leonaid.entrypoints.cms_storage,
      ]
  cms-probe:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: emdash-media
      S3_ACCESS_KEY_ID: leonaid-emdash
      S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY}
      S3_REGION: us-east-1
    volumes: [../..:/workspace:ro]
    working_dir: /workspace
    networks: [edge, cms-data, storage-data]
    command: [node, tools/emdash_spike/service-proof.mjs]
