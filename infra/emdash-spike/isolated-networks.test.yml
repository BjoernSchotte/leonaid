# Test-only, applied last for non-recovery auth/browser/order proofs. Replace
# inherited pools rather than appending a second CRM subnet from orders.test.yml.
networks:
  core-data:
    ipam:
      config: !override
        - subnet: "${EMDASH_TEST_NET_PREFIX:?isolated test subnet required}.0/28"
  cms-data:
    ipam:
      config: !override
        - subnet: "${EMDASH_TEST_NET_PREFIX:?isolated test subnet required}.16/28"
  crm-data:
    ipam:
      config: !override
        - subnet: "${EMDASH_TEST_NET_PREFIX:?isolated test subnet required}.32/28"
  storage-data:
    ipam:
      config: !override
        - subnet: "${EMDASH_TEST_NET_PREFIX:?isolated test subnet required}.48/28"
  edge:
    ipam:
      config: !override
        - subnet: "${EMDASH_TEST_NET_PREFIX:?isolated test subnet required}.64/28"
