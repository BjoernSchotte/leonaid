services:
  core-postgres:
    extends:
      file: postgres.test.yml
      service: core-postgres
  rustfs:
    extends:
      file: rustfs.test.yml
      service: rustfs
  cms-db-operator:
    extends:
      file: service.test.yml
      service: cms-db-operator
  cms-storage-operator:
    extends:
      file: service.test.yml
      service: cms-storage-operator
  proof:
    image: docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD:?bootstrap CMS secrets first}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: emdash-media
      S3_ACCESS_KEY_ID: leonaid-emdash
      S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:?bootstrap CMS secrets first}
      S3_REGION: us-east-1
    volumes:
      - ../../node_modules:/workspace/node_modules:ro
      - ../../apps/campaign-site/src/auth:/workspace/apps/campaign-site/src/auth:ro
      - ../../tools/emdash_spike/campaign-media-upload-proof.mjs:/workspace/tools/emdash_spike/campaign-media-upload-proof.mjs:ro
    working_dir: /workspace
    networks: [cms-data, storage-data]
    command: [node, tools/emdash_spike/campaign-media-upload-proof.mjs]
networks:
  core-data:
    internal: true
  cms-data:
    internal: true
  storage-data:
    internal: true
volumes:
  postgres-data:
  rustfs-data:
