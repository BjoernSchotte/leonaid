services:
  admin-browser:
    volumes:
      - ../../apps/public/src/assets/krapfentaxi/logo.png:/workspace/apps/public/src/assets/krapfentaxi/logo.png:ro
      - ../../apps/public/src/assets/krapfentaxi/hero.webp:/workspace/apps/public/src/assets/krapfentaxi/hero.webp:ro
      - ../../apps/campaign-site/src/auth/campaign-image.mjs:/workspace/apps/campaign-site/src/auth/campaign-image.mjs:ro
  krapfentaxi-import-probe:
    image: docker.io/oven/bun:1.4.4-alpine@sha256:4cf82f5686b196504fe119db3fcd9185b191f82ece82c40680e597228ec6070a
    working_dir: /workspace
    volumes: [../..:/workspace:ro]
    networks: [edge, cms-data]
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: emdash-media
      S3_ACCESS_KEY_ID: leonaid-emdash
      S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY}
      S3_REGION: us-east-1
    command: [bun, tools/emdash_spike/krapfentaxi-import-proof.mjs]
