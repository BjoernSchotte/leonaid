name: leonaid

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Runtime hardening for LeonAid's own images: immutable root filesystem, no
# Linux capabilities and no privilege gain through setuid binaries. Services
# that need scratch space add their own tmpfs.
x-hardened-runtime: &hardened-runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Every long-running service has a memory, CPU and process ceiling. The budget
# for an 8 GB VPS is documented in
# apps/docs/src/content/docs/{en,de}/ops/reference/services-ports-and-commands.md;
# change both together.

# The core image runs as this fixed unprivileged uid:gid. Isolated test stacks
# whose harness writes recovery volumes from one-off containers may override it
# with their own host uid; production must keep the default, and the pilot
# deployment contract (tools/pilot_deployment/validate.py) rejects anything else.
x-core-user: &core-user ${LEONAID_CORE_RUNTIME_USER:-10001:10001}

services:
  campaign-site:
    profiles: [emdash]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.campaign-site
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    environment:
      PGHOST: core-postgres
      PGDATABASE: emdash
      PGUSER: emdash
      PGPASSWORD: ${CMS_POSTGRES_PASSWORD:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: emdash-media
      S3_ACCESS_KEY_ID: leonaid-emdash
      S3_SECRET_ACCESS_KEY: ${CMS_S3_SECRET_ACCESS_KEY:-}
      S3_REGION: us-east-1
      EMDASH_SITE_URL: https://localhost:${LEONAID_HTTPS_PORT:-8443}
      EMDASH_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:-}
      LEONAID_ORDER_SUBMISSION_KEY: ${LEONAID_ORDER_SUBMISSION_KEY:-}
    networks: [edge, cms-data, storage-data]
    volumes:
      - cms-bootstrap-state:/app/bootstrap-state
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    # No host port and no dependency from Caddy: CMS failure is isolated.
  proxy:
    build:
      context: ../proxy/image
    logging: *default-logging
    restart: unless-stopped
    # Caddy keeps running as root inside the container because it owns the
    # certificate volumes of existing installs; it gets no capability except
    # binding the pilot's ports 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    pids_limit: 128
    environment:
      LEONAID_HTTPS_PORT: ${LEONAID_HTTPS_PORT:-8443}
      LEONAID_LAN_HOST: ${LEONAID_LAN_HOST:-127.0.0.1}
      LEONAID_REMOTE_HOST: ${LEONAID_REMOTE_HOST:-127.0.0.1}
    ports:
      - "${LEONAID_BIND_ADDRESS:-127.0.0.1}:${LEONAID_HTTP_PORT:-8080}:8080"
      - "${LEONAID_BIND_ADDRESS:-127.0.0.1}:${LEONAID_HTTPS_PORT:-8443}:8443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      pwa:
        condition: service_healthy
      public:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    # Caddy opens :8443 before `tls internal` has issued the certificates;
    # until then a TLS handshake fails (ERR_SSL_PROTOCOL_ERROR). Healthy means
    # HTTP and TLS for both names the tests and the browser use. BusyBox wget
    # sends the URL host as SNI and does not verify the internal CA.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://localhost:8080/_health &&
          wget -qO- https://proxy:8443/_health &&
          wget -qO- https://localhost:8443/_health
      interval: 5s
      timeout: 3s
      retries: 20

  survey-validator:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.survey-validator
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    networks:
      - core-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    user: *core-user
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 256
    command: ["/workspace/infra/compose/start-api.sh"]
    environment:
      LEONAID_ENV: ${LEONAID_ENV:-local}
      LEONAID_DISABLED_MODULES: ${LEONAID_DISABLED_MODULES:-}
      LEONAID_SERVICE_NAME: leonaid-api
      LEONAID_SURVEY_ERASURE_ARCHIVE_DIR: /recovery/survey-erasure
      LEONAID_SERVICE_VERSION: 0.0.0
      LEONAID_API_VERSION: v1
      LEONAID_SECRET_KEY: ${LEONAID_SECRET_KEY}
      LEONAID_ORDER_SUBMISSION_KEY: ${LEONAID_ORDER_SUBMISSION_KEY:-}
      LEONAID_SESSION_ENCRYPTION_KEY: ${LEONAID_SESSION_ENCRYPTION_KEY}
      LEONAID_PUBLIC_BASE_URL: https://localhost:${LEONAID_HTTPS_PORT:-8443}
      LEONAID_ALLOWED_ORIGINS: http://localhost:${LEONAID_HTTP_PORT:-8080},http://127.0.0.1:${LEONAID_HTTP_PORT:-8080},http://proxy:8080,https://localhost:${LEONAID_HTTPS_PORT:-8443},https://127.0.0.1:${LEONAID_HTTPS_PORT:-8443},https://proxy:8443,http://${LEONAID_LAN_HOST:-127.0.0.1}:${LEONAID_HTTP_PORT:-8080},https://${LEONAID_LAN_HOST:-127.0.0.1}:${LEONAID_HTTPS_PORT:-8443},http://${LEONAID_REMOTE_HOST:-127.0.0.1}:${LEONAID_HTTP_PORT:-8080},https://${LEONAID_REMOTE_HOST:-127.0.0.1}:${LEONAID_HTTPS_PORT:-8443}
      LEONAID_TRUST_PROXY_HEADERS: "true"
      LEONAID_INVITATION_TTL_MINUTES: "30"
      LEONAID_LOGIN_CHALLENGE_TTL_MINUTES: ${LEONAID_LOGIN_CHALLENGE_TTL_MINUTES:-10}
      LEONAID_FRESH_LOGIN_SECONDS: ${LEONAID_FRESH_LOGIN_SECONDS:-900}
      LEONAID_MAINTENANCE_FLAG_PATH: /run/leonaid-maintenance/enabled
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-leonaid}:${CORE_POSTGRES_PASSWORD}@core-postgres:5432/${CORE_POSTGRES_DB:-leonaid}
      TWENTY_BASE_URL: http://twenty-server:3000
      TWENTY_INTEGRATION_API_KEY: ${TWENTY_INTEGRATION_API_KEY:-}
      TWENTY_ORIGIN: http://crm.localhost:${LEONAID_HTTP_PORT:-8080}
      TWENTY_HEALTH_URL: http://twenty-server:3000/healthz
      RUSTFS_HEALTH_URL: http://rustfs:9000/health
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PATH_STYLE: "true"
      MAIL_HEALTH_URL: http://mailpit:8025/mail/api/v1/info
      WORKER_HEALTH_URL: http://worker:8010/health/ready
      MAIL_TEST_API_URL: http://mailpit:8025/mail
    volumes:
      - maintenance-state:/run/leonaid-maintenance:ro
      - survey-erasure-archive:/recovery/survey-erasure
    networks:
      - edge
      - core-data
      - crm-data
      - storage-data
      - mail-data
      - telemetry
    depends_on:
      core-volume-init:
        condition: service_completed_successfully
      survey-validator:
        condition: service_healthy
      core-postgres:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    user: *core-user
    # Typst renders invoices and survey reports in temporary directories.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256
    command: ["python", "-m", "leonaid.entrypoints.worker.platform"]
    environment:
      LEONAID_SURVEY_ERASURE_ARCHIVE_DIR: /recovery/survey-erasure
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-leonaid}:${CORE_POSTGRES_PASSWORD}@core-postgres:5432/${CORE_POSTGRES_DB:-leonaid}
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PATH_STYLE: "true"
      LEONAID_ENV: ${LEONAID_ENV:-local}
      LEONAID_DISABLED_MODULES: ${LEONAID_DISABLED_MODULES:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-LeonAid <noreply@leonaid.invalid>}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:-bounces@leonaid.invalid}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@leonaid.invalid}
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:-plain}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_TIMEOUT_SECONDS: ${MAIL_SMTP_TIMEOUT_SECONDS:-10}
      MAIL_SMTP_VERIFY_CERTIFICATES: ${MAIL_SMTP_VERIFY_CERTIFICATES:-true}
      MAIL_SMTP_CA_FILE: ${MAIL_SMTP_CA_FILE:-}
      LEONAID_SESSION_ENCRYPTION_KEY: ${LEONAID_SESSION_ENCRYPTION_KEY}
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_BASE_BACKOFF_SECONDS: "5"
      OUTBOX_CLAIM_LEASE_SECONDS: "300"
    volumes:
      - survey-erasure-archive:/recovery/survey-erasure
    networks:
      - core-data
      - crm-data
      - storage-data
      - mail-data
      - telemetry
    depends_on:
      core-volume-init:
        condition: service_completed_successfully
      core-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  # One-shot ownership handover for volumes the unprivileged core writes to.
  # Releases before the non-root core image wrote them as root; an existing
  # install's api would otherwise fail to publish the erasure checkpoint at
  # startup and its worker on every retention sweep. It runs before every api/worker start, is idempotent
  # and has no network and only the capabilities chown needs.
  core-volume-init:
    image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    logging: *default-logging
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    cpus: 0.5
    pids_limit: 16
    command:
      - chown
      - -R
      - *core-user
      - /recovery/survey-erasure
    volumes:
      - survey-erasure-archive:/recovery/survey-erasure

  core-postgres:
    image: docker.io/library/postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 256
    environment:
      POSTGRES_DB: ${CORE_POSTGRES_DB:-leonaid}
      POSTGRES_USER: ${CORE_POSTGRES_USER:-leonaid}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD}
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
    networks:
      - core-data
      - cms-data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      APP_NAME: "LeonAid Verwaltung"
      APP_KIND: web
    networks:
      - edge
    healthcheck: &frontend-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  pwa:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.pwa
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      APP_NAME: "LeonAid Akquise"
      APP_KIND: pwa
    networks:
      - edge
    healthcheck: *frontend-health

  public:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.public
    logging: *default-logging
    restart: unless-stopped
    <<: *hardened-runtime
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    environment:
      CORE_API_URL: http://api:8000
      LEONAID_ORDER_SUBMISSION_KEY: ${LEONAID_ORDER_SUBMISSION_KEY:-}
      HOST: 0.0.0.0
      PORT: "3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-health

  twenty-server:
    image: docker.io/twentycrm/twenty:v2.54.0@sha256:e64479a4daa9211864eb45ffdf15ce7a44a3664850dab06213105027538fce1e
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Node must not be PID 1: Nest's shutdown hooks re-raise SIGTERM after
    # closing, which the kernel ignores for PID 1, so `docker stop` would end
    # in SIGKILL. The init process forwards the signal and reaps children.
    init: true
    # Peak 1218 MiB (2026-11, Twenty 2.54): every start first runs
    # `yarn command:prod upgrade` (node up to ~1085 MiB RSS plus the yarn
    # wrapper) before `node dist/main`. 1728m keeps that peak at 70 %.
    mem_limit: 1728m
    cpus: 2
    pids_limit: 512
    environment:
      <<: &twenty-environment
        NODE_PORT: "3000"
        PG_DATABASE_URL: postgresql://${TWENTY_POSTGRES_USER:-twenty}:${TWENTY_POSTGRES_PASSWORD}@twenty-postgres:5432/${TWENTY_POSTGRES_DB:-default}
        SERVER_URL: http://crm.localhost:${LEONAID_HTTP_PORT:-8080}
        REDIS_URL: redis://twenty-redis:6379
        DISABLE_DB_MIGRATIONS: "false"
        DISABLE_CRON_JOBS_REGISTRATION: "false"
        STORAGE_TYPE: local
        ENCRYPTION_KEY: ${TWENTY_ACCESS_TOKEN_SECRET}
        FALLBACK_ENCRYPTION_KEY: ${TWENTY_LOGIN_TOKEN_SECRET}
        APP_SECRET: ${LEONAID_SECRET_KEY}
        SIGN_IN_PREFILLED: "false"
        IS_EMAIL_VERIFICATION_REQUIRED: "false"
        IS_MULTIWORKSPACE_ENABLED: "false"
      # Node sizes the V8 old space from the cgroup limit unless pinned.
      # Measured heapUsed peaks at 711 MiB of the 1072 MiB heap limit (66 %,
      # CRM import), and RSS adds ~230 MiB native memory beyond heapTotal.
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    networks:
      - edge
      - crm-data
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  twenty-worker:
    image: docker.io/twentycrm/twenty:v2.54.0@sha256:e64479a4daa9211864eb45ffdf15ce7a44a3664850dab06213105027538fce1e
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 1400m
    cpus: 1.5
    pids_limit: 512
    # Same process as `yarn worker:prod`, without the two yarn wrapper
    # processes (~200 MiB RSS). yarn 1 exited at once on SIGTERM and dropped
    # the worker; now the init process forwards SIGTERM to node, and Nest's
    # shutdown hooks close the BullMQ workers before the process exits.
    init: true
    command: ["node", "dist/queue-worker/queue-worker"]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      # heapUsed peaks at 560 MiB of the 816 MiB heap limit (69 %, CRM
      # import); RSS stays at most 860 MiB, well inside the 1400m limit.
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    networks:
      - crm-data
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[q]ueue-worker/queue-worker' >/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 200

  twenty-postgres:
    image: docker.io/library/postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 256
    environment:
      POSTGRES_DB: ${TWENTY_POSTGRES_DB:-default}
      POSTGRES_USER: ${TWENTY_POSTGRES_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_POSTGRES_PASSWORD}
    volumes:
      - twenty-postgres-data:/var/lib/postgresql/data
    networks:
      - crm-data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  # Valkey (BSD-3-Clause) speaks the Redis protocol Twenty uses (BullMQ,
  # cache, pub/sub). The service and volume keep the name twenty-redis:
  # Twenty reads REDIS_URL, and backups, manifests and tests address the
  # service by this name. Valkey cannot read Redis 7.4 RDB files (format 12);
  # infra/upgrade/twenty-queue-store.sh drains and resets an old volume.
  twenty-redis:
    image: docker.io/valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    # maxmemory stays below mem_limit: with noeviction (required by BullMQ),
    # Valkey then rejects writes with an error instead of being OOM-killed
    # with queued jobs. Twenty keeps up to 1000 completed and 1000 failed
    # jobs per queue (fixed in its code); an import burst measured 110 MiB.
    command:
      ["valkey-server", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - twenty-redis-data:/data
    networks:
      - crm-data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      - storage-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    logging: *default-logging
    profiles: ["storage-contract"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: leonaid-contract
    volumes:
      - seaweedfs-data:/data
    networks:
      - storage-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mailpit:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    logging: *default-logging
    profiles: ["dev-mail"]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mail/
    volumes:
      - mailpit-data:/data
    networks:
      - edge
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit-contract-starttls:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    logging: *default-logging
    profiles: ["mail-contract"]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_SMTP_TLS_CERT: sans:mailpit-contract-starttls
      MP_SMTP_TLS_KEY: sans:mailpit-contract-starttls
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: pilot-user:pilot-password
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit-contract-chaos:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    logging: *default-logging
    profiles: ["mail-contract"]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_CHAOS_TRIGGERS: Recipient:452:100
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit-contract-tls:
    image: docker.io/axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    logging: *default-logging
    profiles: ["mail-contract"]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_SMTP_TLS_CERT: sans:mailpit-contract-tls
      MP_SMTP_TLS_KEY: sans:mailpit-contract-tls
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_AUTH: pilot-user:pilot-password
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mail-contract-blackhole:
    image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    logging: *default-logging
    profiles: ["mail-contract"]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 16
    command:
      - /bin/sh
      - -c
      - while true; do sleep 60 | nc -l -p 1025; done
    networks:
      - mail-data

  listmonk:
    image: docker.io/listmonk/listmonk:v5.0.3@sha256:d8f1a7fe7852a529139389564f32a914c278d394c75cb72bcde55bb2324f182e
    logging: *default-logging
    profiles: ["mailing"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    command:
      - sh
      - -c
      - "./listmonk --install --yes --idempotent && ./listmonk"
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
    networks:
      - edge
      - mailing-data
    depends_on:
      listmonk-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  listmonk-postgres:
    image: docker.io/library/postgres:16.15-alpine3.24@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    logging: *default-logging
    profiles: ["mailing"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_POSTGRES_PASSWORD}
    volumes:
      - listmonk-postgres-data:/var/lib/postgresql/data
    networks:
      - mailing-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    logging: *default-logging
    profiles: ["observability"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  survey-erasure-archive:
  cms-bootstrap-state:
  core-postgres-data:
  twenty-postgres-data:
  twenty-redis-data:
  twenty-server-data:
  rustfs-data:
  seaweedfs-data:
  mailpit-data:
  listmonk-postgres-data:
  maintenance-state:

networks:
  cms-data:
    internal: true
  edge:
  core-data:
    internal: true
  crm-data:
    internal: true
  storage-data:
    internal: true
  mail-data:
    internal: true
  mailing-data:
    internal: true
  telemetry:
    internal: true
