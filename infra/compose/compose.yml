name: leonaid

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEONAID_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${LEONAID_HTTPS_PORT:-8443}:8443"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      pwa:
        condition: service_healthy
      public:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/_health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    logging: *default-logging
    restart: unless-stopped
    command: ["/workspace/infra/compose/start-api.sh"]
    environment:
      LEONAID_ENV: ${LEONAID_ENV:-local}
      LEONAID_SERVICE_NAME: leonaid-api
      LEONAID_SERVICE_VERSION: 0.0.0
      LEONAID_API_VERSION: v1
      LEONAID_SECRET_KEY: ${LEONAID_SECRET_KEY}
      LEONAID_SESSION_ENCRYPTION_KEY: ${LEONAID_SESSION_ENCRYPTION_KEY}
      LEONAID_PUBLIC_BASE_URL: https://localhost:${LEONAID_HTTPS_PORT:-8443}
      LEONAID_ALLOWED_ORIGINS: http://localhost:${LEONAID_HTTP_PORT:-8080},http://127.0.0.1:${LEONAID_HTTP_PORT:-8080},http://proxy:8080,https://localhost:${LEONAID_HTTPS_PORT:-8443},https://127.0.0.1:${LEONAID_HTTPS_PORT:-8443},https://proxy:8443
      LEONAID_TRUST_PROXY_HEADERS: "true"
      LEONAID_INVITATION_TTL_MINUTES: "30"
      LEONAID_LOGIN_CHALLENGE_TTL_MINUTES: ${LEONAID_LOGIN_CHALLENGE_TTL_MINUTES:-10}
      LEONAID_FRESH_LOGIN_SECONDS: ${LEONAID_FRESH_LOGIN_SECONDS:-900}
      LEONAID_MAINTENANCE_FLAG_PATH: /run/leonaid-maintenance/enabled
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-leonaid}:${CORE_POSTGRES_PASSWORD}@core-postgres:5432/${CORE_POSTGRES_DB:-leonaid}
      TWENTY_BASE_URL: http://twenty-server:3000
      TWENTY_INTEGRATION_API_KEY: ${TWENTY_INTEGRATION_API_KEY:-}
      TWENTY_ORIGIN: http://crm.localhost:${LEONAID_HTTP_PORT:-8080}
      TWENTY_HEALTH_URL: http://twenty-server:3000/healthz
      RUSTFS_HEALTH_URL: http://rustfs:9000/health
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PATH_STYLE: "true"
      MAIL_HEALTH_URL: http://mailpit:8025/mail/api/v1/info
      WORKER_HEALTH_URL: http://worker:8010/health/ready
      MAIL_TEST_API_URL: http://mailpit:8025/mail
    volumes:
      - maintenance-state:/run/leonaid-maintenance:ro
    networks:
      - edge
      - core-data
      - crm-data
      - storage-data
      - mail-data
      - telemetry
    depends_on:
      core-postgres:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    logging: *default-logging
    restart: unless-stopped
    command: ["python", "-m", "leonaid.entrypoints.worker.platform"]
    environment:
      CORE_DATABASE_URL: postgresql://${CORE_POSTGRES_USER:-leonaid}:${CORE_POSTGRES_PASSWORD}@core-postgres:5432/${CORE_POSTGRES_DB:-leonaid}
      RUSTFS_ENDPOINT_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
      OBJECT_STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:-leonaid}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_PATH_STYLE: "true"
      LEONAID_ENV: ${LEONAID_ENV:-local}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-LeonAid <noreply@leonaid.invalid>}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:-bounces@leonaid.invalid}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@leonaid.invalid}
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:-plain}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_TIMEOUT_SECONDS: ${MAIL_SMTP_TIMEOUT_SECONDS:-10}
      MAIL_SMTP_VERIFY_CERTIFICATES: ${MAIL_SMTP_VERIFY_CERTIFICATES:-true}
      MAIL_SMTP_CA_FILE: ${MAIL_SMTP_CA_FILE:-}
      LEONAID_SESSION_ENCRYPTION_KEY: ${LEONAID_SESSION_ENCRYPTION_KEY}
      OUTBOX_MAX_ATTEMPTS: "5"
      OUTBOX_BASE_BACKOFF_SECONDS: "5"
      OUTBOX_CLAIM_LEASE_SECONDS: "300"
    networks:
      - core-data
      - crm-data
      - storage-data
      - mail-data
      - telemetry
    depends_on:
      core-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 20

  core-postgres:
    image: docker.io/library/postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CORE_POSTGRES_DB:-leonaid}
      POSTGRES_USER: ${CORE_POSTGRES_USER:-leonaid}
      POSTGRES_PASSWORD: ${CORE_POSTGRES_PASSWORD}
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
    networks:
      - core-data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
    logging: *default-logging
    restart: unless-stopped
    environment:
      APP_NAME: "LeonAid Verwaltung"
      APP_KIND: web
    networks:
      - edge
    healthcheck: &frontend-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  pwa:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.pwa
    logging: *default-logging
    restart: unless-stopped
    environment:
      APP_NAME: "LeonAid Akquise"
      APP_KIND: pwa
    networks:
      - edge
    healthcheck: *frontend-health

  public:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.public
    logging: *default-logging
    restart: unless-stopped
    environment:
      CORE_API_URL: http://api:8000
      HOST: 0.0.0.0
      PORT: "3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *frontend-health

  twenty-server:
    image: docker.io/twentycrm/twenty:v2.24.0@sha256:333b6e3d06904293b3bdad9f4a5eb1489fa8719d886b3e6811aff1d0b85b860c
    logging: *default-logging
    restart: unless-stopped
    environment: &twenty-environment
      NODE_PORT: "3000"
      PG_DATABASE_URL: postgresql://${TWENTY_POSTGRES_USER:-twenty}:${TWENTY_POSTGRES_PASSWORD}@twenty-postgres:5432/${TWENTY_POSTGRES_DB:-default}
      SERVER_URL: http://crm.localhost:${LEONAID_HTTP_PORT:-8080}
      REDIS_URL: redis://twenty-redis:6379
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${TWENTY_ACCESS_TOKEN_SECRET}
      FALLBACK_ENCRYPTION_KEY: ${TWENTY_LOGIN_TOKEN_SECRET}
      APP_SECRET: ${LEONAID_SECRET_KEY}
      SIGN_IN_PREFILLED: "false"
      IS_EMAIL_VERIFICATION_REQUIRED: "false"
      IS_MULTIWORKSPACE_ENABLED: "false"
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    networks:
      - edge
      - crm-data
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  twenty-worker:
    image: docker.io/twentycrm/twenty:v2.24.0@sha256:333b6e3d06904293b3bdad9f4a5eb1489fa8719d886b3e6811aff1d0b85b860c
    logging: *default-logging
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    networks:
      - crm-data
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[w]orker:prod' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  twenty-postgres:
    image: docker.io/library/postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TWENTY_POSTGRES_DB:-default}
      POSTGRES_USER: ${TWENTY_POSTGRES_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_POSTGRES_PASSWORD}
    volumes:
      - twenty-postgres-data:/var/lib/postgresql/data
    networks:
      - crm-data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20

  twenty-redis:
    image: docker.io/library/redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - twenty-redis-data:/data
    networks:
      - crm-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-beta.11@sha256:84ce557a0245a06a9aae5516f55ee0f007fca78d41df356f419306fdc0cb168c
    logging: *default-logging
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      - storage-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    logging: *default-logging
    profiles: ["storage-contract"]
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: leonaid-contract
    volumes:
      - seaweedfs-data:/data
    networks:
      - storage-data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  mailpit:
    image: docker.io/axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    logging: *default-logging
    profiles: ["dev-mail"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mail/
    volumes:
      - mailpit-data:/data
    networks:
      - edge
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit-contract-starttls:
    image: docker.io/axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    logging: *default-logging
    profiles: ["mail-contract"]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_SMTP_TLS_CERT: sans:mailpit-contract-starttls
      MP_SMTP_TLS_KEY: sans:mailpit-contract-starttls
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH: pilot-user:pilot-password
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit-contract-chaos:
    image: docker.io/axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    logging: *default-logging
    profiles: ["mail-contract"]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_CHAOS_TRIGGERS: Recipient:452:100
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mailpit-contract-tls:
    image: docker.io/axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    logging: *default-logging
    profiles: ["mail-contract"]
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_SMTP_TLS_CERT: sans:mailpit-contract-tls
      MP_SMTP_TLS_KEY: sans:mailpit-contract-tls
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_AUTH: pilot-user:pilot-password
    networks:
      - mail-data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  mail-contract-blackhole:
    image: docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    logging: *default-logging
    profiles: ["mail-contract"]
    command:
      - /bin/sh
      - -c
      - while true; do sleep 60 | nc -l -p 1025; done
    networks:
      - mail-data

  listmonk:
    image: docker.io/listmonk/listmonk:v5.0.3@sha256:d8f1a7fe7852a529139389564f32a914c278d394c75cb72bcde55bb2324f182e
    logging: *default-logging
    profiles: ["mailing"]
    restart: unless-stopped
    command:
      - sh
      - -c
      - "./listmonk --install --yes --idempotent && ./listmonk"
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
    networks:
      - edge
      - mailing-data
    depends_on:
      listmonk-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  listmonk-postgres:
    image: docker.io/library/postgres:16.9-alpine3.21@sha256:36e8aabaa6fa6037537cff64011fa45a200fe2ba202141b9aca48cff3df7ad42
    logging: *default-logging
    profiles: ["mailing"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_POSTGRES_PASSWORD}
    volumes:
      - listmonk-postgres-data:/var/lib/postgresql/data
    networks:
      - mailing-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    logging: *default-logging
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  core-postgres-data:
  twenty-postgres-data:
  twenty-redis-data:
  twenty-server-data:
  rustfs-data:
  seaweedfs-data:
  mailpit-data:
  listmonk-postgres-data:
  maintenance-state:

networks:
  edge:
  core-data:
    internal: true
  crm-data:
    internal: true
  storage-data:
    internal: true
  mail-data:
    internal: true
  mailing-data:
    internal: true
  telemetry:
    internal: true
