# Local development extensions for the `./leonaid dev` stack only.
#
# The CLI adds this file for the default dev project when .local/dev exists
# (see infra/compose/README.md). It mounts uncommitted, git-ignored Caddy
# snippets and static files into the proxy, read-only. Test stacks and the
# pilot never load it.
services:
  proxy:
    volumes:
      - ../../.local/dev/caddy.d:/etc/caddy/local.d:ro
      - ../../.local/dev/static:/srv/local-static:ro
  # The dev worker geocodes delivery addresses against the public Nominatim
  # (specs/krapfentaxi-touren §8.2, D8) and sends Web Push to the browser
  # vendors' push services (ADR-0017): a dev-only egress network, like the
  # pilot's `mail-egress`. Test stacks keep their internal-only networks.
  worker:
    networks:
      - geocoder-egress
networks:
  geocoder-egress: {}
