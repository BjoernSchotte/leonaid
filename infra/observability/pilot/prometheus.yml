global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    system: leonaid

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: leonaid-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: leonaid-worker
    static_configs:
      - targets: ["worker:8010"]
  - job_name: leonaid-pilot-exporter
    static_configs:
      - targets: ["pilot-exporter:8020"]
