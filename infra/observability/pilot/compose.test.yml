services:
  api:
    environment:
      PILOT_MONITOR_STATUS_URL: http://pilot-exporter:8020/status
      PILOT_ALERTMANAGER_URL: http://alertmanager:9093

  tls-probe:
    image: docker.io/library/caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ../observability/pilot/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - alerting-caddy-data:/data
    networks:
      - telemetry
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443"]
      interval: 2s
      timeout: 2s
      retries: 30

  alert-sink:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["python", "-m", "leonaid.entrypoints.monitoring.sink"]
    # Writes the events file into the harness's private host directory.
    user: ${LEONAID_ALERT_TEST_USER:?LEONAID_ALERT_TEST_USER is missing}
    environment:
      ALERT_SINK_EVENTS_PATH: /events/events.jsonl
    volumes:
      - ${LEONAID_ALERT_TEST_EVENTS_DIR:?LEONAID_ALERT_TEST_EVENTS_DIR is missing}:/events
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=3)"
      interval: 2s
      timeout: 2s
      retries: 30

  pilot-exporter:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.core
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["python", "-m", "leonaid.entrypoints.monitoring.exporter"]
    # Test only: it trusts the tls-probe's local CA, which Caddy stores 0600 as
    # root. Production probes a public ACME certificate and needs no CA file.
    user: "0:0"
    environment:
      PILOT_BACKUP_MANIFEST_PATH: /run/leonaid-monitor/backup-manifest.json
      PILOT_BACKUP_SOURCE_PROJECT: ${LEONAID_ALERT_TEST_PROJECT:?LEONAID_ALERT_TEST_PROJECT is missing}
      PILOT_MONITORED_DISK_PATH: /run/leonaid-monitor/disk
      PILOT_TLS_HOST: tls-probe
      PILOT_TLS_PORT: "8443"
      PILOT_TLS_CA_FILE: /caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - ${LEONAID_ALERT_TEST_BACKUP_MANIFEST:?LEONAID_ALERT_TEST_BACKUP_MANIFEST is missing}:/run/leonaid-monitor/backup-manifest.json:ro
      - alerting-caddy-data:/caddy-data:ro
    tmpfs:
      - /run/leonaid-monitor/disk:size=16777216
    networks:
      - telemetry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health/live', timeout=3)"
      interval: 2s
      timeout: 2s
      retries: 30

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
    volumes:
      - ../observability/pilot/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/pilot/rules.yml:/etc/prometheus/rules.yml:ro
      - alerting-prometheus-data:/prometheus
    networks:
      - telemetry
    depends_on:
      pilot-exporter:
        condition: service_healthy

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/pilot/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../../tests/fixtures/monitoring/alert-webhook-url:/run/secrets/alert-webhook-url:ro
      - ../../tests/fixtures/monitoring/alert-heartbeat-url:/run/secrets/alert-heartbeat-url:ro
      - alerting-alertmanager-data:/alertmanager
    networks:
      - telemetry
    depends_on:
      alert-sink:
        condition: service_healthy

volumes:
  alerting-caddy-data:
  alerting-prometheus-data:
  alerting-alertmanager-data:
