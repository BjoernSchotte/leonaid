services:
  cms-recovery-operator:
    profiles: [cms-recovery]
    # With a verified CMS image (LEONAID_RESTORE_CMS_IMAGE, set by
    # pilot-restore) the operator runs from that image's own copy under
    # /app/recovery: a production checkout has no node_modules. Without one
    # (local recovery proofs) it runs the checkout with its dependencies.
    image: ${LEONAID_RESTORE_CMS_OPERATOR_IMAGE:-docker.io/library/node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202}
    working_dir: ${LEONAID_RESTORE_CMS_OPERATOR_ROOT:-/workspace}
    entrypoint: [node, tools/backup/cms-recovery.mjs]
    environment:
      PGHOST: core-postgres
      PGDATABASE: ${CORE_POSTGRES_DB:-leonaid}
      PGUSER: ${CORE_POSTGRES_USER:-leonaid}
      PGPASSWORD: ${CORE_POSTGRES_PASSWORD:-}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:-}
    networks: [core-data, cms-data]
    volumes: [../..:/workspace:ro]
