services:
  proxy:
    ports: !override
      - "127.0.0.1:${LEONAID_PILOT_TEST_HTTP_PORT:-19080}:80"
      - "127.0.0.1:${LEONAID_PILOT_TEST_HTTPS_PORT:-19443}:443"
    volumes: !override
      - ../pilot/Caddyfile.test:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  api:
    image: ${LEONAID_TEST_CORE_IMAGE:?LEONAID_TEST_CORE_IMAGE fehlt}

  worker:
    image: ${LEONAID_TEST_CORE_IMAGE:?LEONAID_TEST_CORE_IMAGE fehlt}

  web:
    image: ${LEONAID_TEST_WEB_IMAGE:?LEONAID_TEST_WEB_IMAGE fehlt}

  pwa:
    image: ${LEONAID_TEST_PWA_IMAGE:?LEONAID_TEST_PWA_IMAGE fehlt}

  public:
    image: ${LEONAID_TEST_PUBLIC_IMAGE:?LEONAID_TEST_PUBLIC_IMAGE fehlt}
