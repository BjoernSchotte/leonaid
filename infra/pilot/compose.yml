# Compose overlays cannot reference anchors of compose.yml, so the logging
# rotation is repeated here for the services this overlay adds.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Twenty's SMTP driver hands only host, port, credentials and EMAIL_SMTP_NO_TLS
# to nodemailer; Twenty 2.54 offers no requireTLS option. On any port but 465
# nodemailer upgrades with STARTTLS only when the relay offers it, so an
# attacker on the path can strip STARTTLS and read the mail. Twenty therefore
# sends mail only over implicit TLS: MAIL_SMTP_MODE=tls (port 465, which
# nodemailer always wraps in TLS with certificate verification) selects the
# SMTP driver, every other mode the logger driver, which sends nothing.
# tools/pilot_deployment/validate.py requires exactly this script.
x-twenty-mail-policy: &twenty-mail-policy
  - /bin/sh
  - -c
  - |
    if [ "$${MAIL_SMTP_MODE}" = tls ]; then EMAIL_DRIVER=SMTP; else EMAIL_DRIVER=logger; fi
    export EMAIL_DRIVER
    exec /app/entrypoint.sh "$$@"
  - twenty-mail-policy

services:
  proxy:
    image: ${LEONAID_PROXY_IMAGE:?LEONAID_PROXY_IMAGE is missing}
    build: !reset null
    ports: !override
      - "${LEONAID_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${LEONAID_BIND_ADDRESS:-0.0.0.0}:443:443"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is missing}
      # Staging behind a TLS-terminating edge only (the doctor refuses it in
      # production): Caddy uses its internal CA instead of ACME.
      LEONAID_PROXY_LOCAL_CERTS: ${LEONAID_EDGE_TLS:+local_certs}
      LEONAID_PUBLIC_DOMAIN: ${LEONAID_PUBLIC_DOMAIN:-}
      # Set together with LEONAID_PROXY_CADDYFILE=Caddyfile.split
      # (specs/multi-domain stage 1); empty for one host.
      LEONAID_ADMIN_DOMAIN: ${LEONAID_ADMIN_DOMAIN:-}
      LEONAID_PUBLIC_DOMAIN_ALIASES: ${LEONAID_PUBLIC_DOMAIN_ALIASES:-}
    volumes: !override
      # Long syntax: the ":-" default would split the short volume syntax.
      - type: bind
        source: ../pilot/${LEONAID_PROXY_CADDYFILE:-Caddyfile}
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/_health"]

  api:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE is missing}
    build: !reset null
    environment:
      LEONAID_ENV: production
      LEONAID_SERVICE_VERSION: ${LEONAID_SERVICE_VERSION:?LEONAID_SERVICE_VERSION is missing}
      LEONAID_RELEASE_COMMIT: ${LEONAID_RELEASE_COMMIT:?LEONAID_RELEASE_COMMIT is missing}
      # Admin base URL (member mails); the only host without an admin domain.
      LEONAID_PUBLIC_BASE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL is missing}
      # Public host base URL (survey invitations); empty = admin base URL.
      LEONAID_SITE_BASE_URL: ${LEONAID_SITE_BASE_URL:-}
      LEONAID_CLUB_NAME: ${LEONAID_CLUB_NAME:?LEONAID_CLUB_NAME is missing}
      LEONAID_ALLOWED_ORIGINS: ${LEONAID_ALLOWED_ORIGINS:?LEONAID_ALLOWED_ORIGINS is missing}
      # Public host and its aliases: credential-free origins of /api/v1/public/*.
      LEONAID_PUBLIC_ORIGINS: ${LEONAID_PUBLIC_ORIGINS:-}
      # Campaign hosts (specs/multi-domain §7.4): reserved names of the
      # public host, the daily re-check in the API process, TLS via the edge.
      LEONAID_PUBLIC_DOMAIN_ALIASES: ${LEONAID_PUBLIC_DOMAIN_ALIASES:-}
      LEONAID_PUBLIC_HOST_ENABLED: ${LEONAID_PUBLIC_HOST_ENABLED:-true}
      LEONAID_SITE_HOST_RECHECK_INTERVAL_SECONDS: "600"
      LEONAID_SITE_HOST_TLS_EDGE: proxy:443
      # Overrides of the dev values of the base file: public addresses on
      # port 80 only, the system trust store only.
      LEONAID_SITE_HOST_CHECK_ALLOW_PRIVATE: "false"
      LEONAID_SITE_HOST_CHECK_HTTP_PORT: "80"
      LEONAID_SITE_HOST_TLS_CA_FILE: ""
      # The server's own public addresses; empty = those of the admin host.
      LEONAID_SITE_HOST_EDGE_NAME: ""
      LEONAID_SITE_HOST_EDGE_ADDRESSES: ${LEONAID_SITE_HOST_EDGE_ADDRESSES:-}
      LEONAID_SITE_HOST_PUBLIC_RESOLVERS: ${LEONAID_SITE_HOST_PUBLIC_RESOLVERS:-}
      TWENTY_ORIGIN: http://localhost:${TWENTY_ADMIN_PORT:?TWENTY_ADMIN_PORT is missing}
      MAIL_HEALTH_URL: ${MAIL_HEALTH_URL:?MAIL_HEALTH_URL is missing}
      WORKER_HEALTH_URL: http://worker:8010/health/ready
      PILOT_MONITOR_STATUS_URL: http://pilot-exporter:8020/status
      PILOT_ALERTMANAGER_URL: http://alertmanager:9093
      MAIL_TEST_API_URL: !reset null
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is missing}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is missing}

  survey-validator:
    image: ${LEONAID_SURVEY_VALIDATOR_IMAGE:?LEONAID_SURVEY_VALIDATOR_IMAGE is missing}
    build: !reset null

  worker:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE is missing}
    build: !reset null
    # Every network of the base stack is internal. The external SMTP relay,
    # the geocoder and the push services of the browser vendors (ADR-0017)
    # are only reachable through this dedicated egress network.
    networks:
      - mail-egress
    environment:
      LEONAID_ENV: production
      # The geocoder's User-Agent names the installation (Nominatim policy).
      LEONAID_PUBLIC_BASE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL is missing}
      # The delivery-day mail links /impressum and /datenschutz of the public
      # host; the worker queues it and so builds these links itself.
      LEONAID_SITE_BASE_URL: ${LEONAID_SITE_BASE_URL:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?MAIL_SMTP_HOST is missing}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:?MAIL_SMTP_PORT is missing}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is missing}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:?MAIL_ENVELOPE_FROM is missing}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:?MAIL_REPLY_TO is missing}
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:?MAIL_SMTP_MODE is missing}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_TIMEOUT_SECONDS: ${MAIL_SMTP_TIMEOUT_SECONDS:-10}
      MAIL_SMTP_VERIFY_CERTIFICATES: "true"
      MAIL_SMTP_CA_FILE: ${MAIL_SMTP_CA_FILE:-}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is missing}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is missing}
    # The private CA of the staging Mailpit relay (profile staging-mail);
    # an empty volume everywhere else.
    volumes:
      - staging-mail-tls:/run/leonaid-staging-mail:ro
    # Waits for the staging Mailpit CA; without the profile nothing waits.
    depends_on:
      staging-mail-tls:
        condition: service_completed_successfully
        required: false

  web:
    image: ${LEONAID_WEB_IMAGE:?LEONAID_WEB_IMAGE is missing}
    build: !reset null

  pwa:
    image: ${LEONAID_PWA_IMAGE:?LEONAID_PWA_IMAGE is missing}
    build: !reset null

  public:
    image: ${LEONAID_PUBLIC_IMAGE:?LEONAID_PUBLIC_IMAGE is missing}
    build: !reset null
    environment:
      # Astro trusts only allowed Host headers for Astro.url and checkOrigin.
      LEONAID_PUBLIC_DOMAIN: ${LEONAID_PUBLIC_DOMAIN:-}
      LEONAID_ADMIN_DOMAIN: ${LEONAID_ADMIN_DOMAIN:-}
      # Public header: a separate admin host gets a static sign-in link.
      LEONAID_ADMIN_BASE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL is missing}

  # Campaign pages and the EmDash editor (specs/multi-domain stage 0). Part of
  # the stack only with the emdash profile: LEONAID_CMS_ENABLED=true in the
  # env file makes every ./leonaid pilot command add --profile emdash. The
  # database role, media bucket, editor setup and campaign schema are
  # provisioned once with ./leonaid pilot-cms-provision (specs/multi-domain
  # §16.7; help docs "Install LeonAid on a fresh VPS").
  campaign-site:
    # Without the CMS the service stays inactive; the placeholder only keeps
    # `--profile '*'` renders valid. The pilot contract rejects it (no digest)
    # should the profile ever be enabled without a release image.
    image: ${LEONAID_CAMPAIGN_SITE_IMAGE:-leonaid-cms-disabled.invalid/campaign-site:unset}
    build: !reset null
    environment:
      # Admin origin: the editor and its sign-in links live on the admin host.
      EMDASH_SITE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL is missing}
      # Public origin of campaign pages; empty = EMDASH_SITE_URL (one host).
      LEONAID_SITE_BASE_URL: ${LEONAID_SITE_BASE_URL:-}
      LEONAID_PUBLIC_DOMAIN: ${LEONAID_PUBLIC_DOMAIN:-}
      LEONAID_ADMIN_DOMAIN: ${LEONAID_ADMIN_DOMAIN:-}
      # Public header: a separate admin host gets a static sign-in link.
      LEONAID_ADMIN_BASE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL is missing}

  # The CRM UI is for the system administrator only and has no public domain.
  # twenty-server publishes its port on the host's loopback interface only;
  # `./leonaid crm-admin` prints the SSH port forwarding that reaches it.
  # SERVER_URL is the forwarded URL, so the browser's links and API calls stay
  # inside the tunnel. The proxy no longer reaches Twenty: twenty-server leaves
  # the edge network and gets its own crm-admin network, the only non-internal
  # network that can carry the published port.
  twenty-server:
    entrypoint: *twenty-mail-policy
    # Setting an entrypoint clears the image's CMD; this is the image's own.
    command: ["node", "dist/main"]
    ports:
      - "127.0.0.1:${TWENTY_ADMIN_PORT:?TWENTY_ADMIN_PORT is missing}:3000"
    networks: !override
      - crm-data
      - crm-admin
    environment: &twenty-production-mail
      SERVER_URL: http://localhost:${TWENTY_ADMIN_PORT:?TWENTY_ADMIN_PORT is missing}
      # In production Twenty refuses a loopback SERVER_URL as credentialed
      # origin unless it is listed here. The browser behind the tunnel is
      # same-origin anyway; LeonAid's own tools reach twenty-server:3000 with
      # this Origin header (TWENTY_ORIGIN) and need the explicit entry.
      AUTH_COOKIE_ALLOWED_ORIGINS: http://localhost:${TWENTY_ADMIN_PORT:?TWENTY_ADMIN_PORT is missing}
      IS_EMAIL_VERIFICATION_REQUIRED: "true"
      # Read by the mail policy above; the core worker uses the same value.
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:?MAIL_SMTP_MODE is missing}
      EMAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?MAIL_SMTP_HOST is missing}
      EMAIL_SMTP_PORT: ${MAIL_SMTP_PORT:?MAIL_SMTP_PORT is missing}
      EMAIL_SMTP_USER: ${MAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_NO_TLS: "false"
      EMAIL_FROM_ADDRESS: ${TWENTY_MAIL_FROM_ADDRESS:?TWENTY_MAIL_FROM_ADDRESS is missing}
      EMAIL_FROM_NAME: ${TWENTY_MAIL_FROM_NAME:?TWENTY_MAIL_FROM_NAME is missing}

  twenty-worker:
    entrypoint: *twenty-mail-policy
    environment:
      <<: *twenty-production-mail
      # Set to the staging Mailpit CA (profile staging-mail); empty otherwise.
      NODE_EXTRA_CA_CERTS: ${MAIL_SMTP_CA_FILE:-}
    # Twenty's e-mail queue runs in the worker; it needs the relay.
    networks:
      - mail-egress
    volumes:
      - staging-mail-tls:/run/leonaid-staging-mail:ro
    # Twenty reads the CA at start; without the profile nothing waits.
    depends_on:
      staging-mail-tls:
        condition: service_completed_successfully
        required: false

  # Staging without a real SMTP account (LEONAID_STAGING_MAILPIT=true, which
  # ./leonaid turns into this profile; the doctor refuses it in production).
  # Mailpit plays the relay with implicit TLS on 465 and a private CA that only
  # the core worker and Twenty trust (MAIL_SMTP_CA_FILE). Nothing leaves the
  # server: read the mails in Mailpit's web UI on port 8025, protected by
  # LEONAID_STAGING_MAILPIT_UI_AUTH (user:password) and the host firewall.
  staging-mail-tls:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE is missing}
    profiles: [staging-mail]
    logging: *default-logging
    restart: "no"
    # Writes into a fresh named volume, which belongs to root.
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32
    # The image's venv python; uv would need a writable cache.
    entrypoint: ["python", "-m", "leonaid.entrypoints.staging_mail_tls"]
    command: ["/smtp", "mailpit"]
    volumes:
      - staging-mail-tls:/smtp

  mailpit:
    profiles: !override [staging-mail]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:465
      MP_SMTP_TLS_CERT: /smtp/cert.pem
      MP_SMTP_TLS_KEY: /smtp/key.pem
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_UI_AUTH: ${LEONAID_STAGING_MAILPIT_UI_AUTH:-}
      MP_WEBROOT: /
    ports:
      - "${LEONAID_BIND_ADDRESS:-0.0.0.0}:8025:8025"
    volumes: !override
      - mailpit-data:/data
      - staging-mail-tls:/smtp:ro
    networks: !override
      - mail-egress
    depends_on:
      staging-mail-tls:
        condition: service_completed_successfully

  pilot-exporter:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE is missing}
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    # The exporter reads the operator's 0600 backup manifest, so it runs as
    # the operator account. ./leonaid sets LEONAID_OPERATOR_USER to the uid:gid
    # of its caller; without it the exporter falls back to the core uid and
    # the backup alert fires instead of silently passing.
    user: ${LEONAID_OPERATOR_USER:-10001:10001}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    command: ["python", "-m", "leonaid.entrypoints.monitoring.exporter"]
    environment:
      PILOT_BACKUP_MANIFEST_PATH: /run/leonaid-monitor/backup-manifest.json
      PILOT_BACKUP_SOURCE_PROJECT: ${LEONAID_COMPOSE_PROJECT:?LEONAID_COMPOSE_PROJECT is missing}
      PILOT_MONITORED_DISK_PATH: /run/leonaid-monitor/disk
      # Every certificate the edge serves: public host, admin host, aliases.
      PILOT_TLS_HOST: ${LEONAID_PUBLIC_DOMAIN:-} ${LEONAID_ADMIN_DOMAIN:-} ${LEONAID_PUBLIC_DOMAIN_ALIASES:-}
      PILOT_TLS_PORT: "443"
      PILOT_TLS_CA_FILE: ${LEONAID_TLS_CA_FILE:-}
    volumes:
      - ${LEONAID_BACKUP_MANIFEST_PATH:?LEONAID_BACKUP_MANIFEST_PATH is missing}:/run/leonaid-monitor/backup-manifest.json:ro
      - ${LEONAID_MONITORED_DISK_PATH:?LEONAID_MONITORED_DISK_PATH is missing}:/run/leonaid-monitor/disk:ro
    networks:
      - edge
      - telemetry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health/live', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 20

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../observability/pilot/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/pilot/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - telemetry
    depends_on:
      pilot-exporter:
        condition: service_healthy

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/pilot/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${LEONAID_ALERT_WEBHOOK_URL_FILE:?LEONAID_ALERT_WEBHOOK_URL_FILE is missing}:/run/secrets/alert-webhook-url:ro
      - ${LEONAID_ALERT_HEARTBEAT_URL_FILE:?LEONAID_ALERT_HEARTBEAT_URL_FILE is missing}:/run/secrets/alert-heartbeat-url:ro
      - alertmanager-data:/alertmanager
    networks:
      - telemetry

networks:
  # Carries only the loopback-published port of twenty-server (see above).
  crm-admin: {}
  # The only egress of the mail senders (core worker, twenty-worker); no
  # other service joins it.
  mail-egress: {}

volumes:
  caddy-data:
  caddy-config:
  staging-mail-tls:
  prometheus-data:
  alertmanager-data:
