# Compose overlays cannot reference anchors of compose.yml, so the logging
# rotation is repeated here for the services this overlay adds.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: ${LEONAID_PROXY_IMAGE:?LEONAID_PROXY_IMAGE fehlt}
    build: !reset null
    ports: !override
      - "${LEONAID_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${LEONAID_BIND_ADDRESS:-0.0.0.0}:443:443"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL fehlt}
      LEONAID_PUBLIC_DOMAIN: ${LEONAID_PUBLIC_DOMAIN:?LEONAID_PUBLIC_DOMAIN fehlt}
      TWENTY_PUBLIC_DOMAIN: ${TWENTY_PUBLIC_DOMAIN:?TWENTY_PUBLIC_DOMAIN fehlt}
    volumes: !override
      - ../pilot/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/_health"]

  api:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE fehlt}
    build: !reset null
    environment:
      LEONAID_ENV: production
      LEONAID_SERVICE_VERSION: ${LEONAID_SERVICE_VERSION:?LEONAID_SERVICE_VERSION fehlt}
      LEONAID_RELEASE_COMMIT: ${LEONAID_RELEASE_COMMIT:?LEONAID_RELEASE_COMMIT fehlt}
      LEONAID_PUBLIC_BASE_URL: ${LEONAID_PUBLIC_BASE_URL:?LEONAID_PUBLIC_BASE_URL fehlt}
      LEONAID_ALLOWED_ORIGINS: ${LEONAID_ALLOWED_ORIGINS:?LEONAID_ALLOWED_ORIGINS fehlt}
      TWENTY_ORIGIN: ${TWENTY_PUBLIC_BASE_URL:?TWENTY_PUBLIC_BASE_URL fehlt}
      MAIL_HEALTH_URL: ${MAIL_HEALTH_URL:?MAIL_HEALTH_URL fehlt}
      WORKER_HEALTH_URL: http://worker:8010/health/ready
      PILOT_MONITOR_STATUS_URL: http://pilot-exporter:8020/status
      PILOT_ALERTMANAGER_URL: http://alertmanager:9093
      MAIL_TEST_API_URL: !reset null
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET fehlt}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET fehlt}

  survey-validator:
    image: ${LEONAID_SURVEY_VALIDATOR_IMAGE:?LEONAID_SURVEY_VALIDATOR_IMAGE fehlt}
    build: !reset null

  worker:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE fehlt}
    build: !reset null
    # Every network of the base stack is internal. The external SMTP relay is
    # only reachable through this dedicated egress network.
    networks:
      - mail-egress
    environment:
      LEONAID_ENV: production
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?MAIL_SMTP_HOST fehlt}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:?MAIL_SMTP_PORT fehlt}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM fehlt}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:?MAIL_ENVELOPE_FROM fehlt}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:?MAIL_REPLY_TO fehlt}
      MAIL_SMTP_MODE: ${MAIL_SMTP_MODE:?MAIL_SMTP_MODE fehlt}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_TIMEOUT_SECONDS: ${MAIL_SMTP_TIMEOUT_SECONDS:-10}
      MAIL_SMTP_VERIFY_CERTIFICATES: "true"
      MAIL_SMTP_CA_FILE: ${MAIL_SMTP_CA_FILE:-}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET fehlt}
      OBJECT_STORAGE_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET fehlt}

  web:
    image: ${LEONAID_WEB_IMAGE:?LEONAID_WEB_IMAGE fehlt}
    build: !reset null

  pwa:
    image: ${LEONAID_PWA_IMAGE:?LEONAID_PWA_IMAGE fehlt}
    build: !reset null

  public:
    image: ${LEONAID_PUBLIC_IMAGE:?LEONAID_PUBLIC_IMAGE fehlt}
    build: !reset null

  # Twenty sends its own mail (address verification, password reset,
  # invitations) through the SMTP relay of the core worker. Twenty 2.24 hands
  # host, port and credentials to nodemailer: port 465 means implicit TLS,
  # any other port upgrades with STARTTLS when the relay offers it, and the
  # certificate is always verified against the public CA store.
  # tools/pilot_deployment/validate.py enforces the port for MAIL_SMTP_MODE.
  twenty-server:
    environment: &twenty-production-mail
      SERVER_URL: ${TWENTY_PUBLIC_BASE_URL:?TWENTY_PUBLIC_BASE_URL fehlt}
      IS_EMAIL_VERIFICATION_REQUIRED: "true"
      EMAIL_DRIVER: SMTP
      EMAIL_SMTP_HOST: ${MAIL_SMTP_HOST:?MAIL_SMTP_HOST fehlt}
      EMAIL_SMTP_PORT: ${MAIL_SMTP_PORT:?MAIL_SMTP_PORT fehlt}
      EMAIL_SMTP_USER: ${MAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_NO_TLS: "false"
      EMAIL_FROM_ADDRESS: ${TWENTY_MAIL_FROM_ADDRESS:?TWENTY_MAIL_FROM_ADDRESS is missing}
      EMAIL_FROM_NAME: ${TWENTY_MAIL_FROM_NAME:?TWENTY_MAIL_FROM_NAME is missing}

  twenty-worker:
    environment: *twenty-production-mail
    # Twenty's e-mail queue runs in the worker; it needs the relay.
    networks:
      - mail-egress

  pilot-exporter:
    image: ${LEONAID_CORE_IMAGE:?LEONAID_CORE_IMAGE fehlt}
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    # The exporter reads the operator's 0600 backup manifest, so it runs as
    # the operator account. ./leonaid sets LEONAID_OPERATOR_USER to the uid:gid
    # of its caller; without it the exporter falls back to the core uid and
    # the backup alert fires instead of silently passing.
    user: ${LEONAID_OPERATOR_USER:-10001:10001}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    command: ["python", "-m", "leonaid.entrypoints.monitoring.exporter"]
    environment:
      PILOT_BACKUP_MANIFEST_PATH: /run/leonaid-monitor/backup-manifest.json
      PILOT_BACKUP_SOURCE_PROJECT: ${LEONAID_COMPOSE_PROJECT:?LEONAID_COMPOSE_PROJECT fehlt}
      PILOT_MONITORED_DISK_PATH: /run/leonaid-monitor/disk
      PILOT_TLS_HOST: ${LEONAID_PUBLIC_DOMAIN:?LEONAID_PUBLIC_DOMAIN fehlt}
      PILOT_TLS_PORT: "443"
      PILOT_TLS_CA_FILE: ${LEONAID_TLS_CA_FILE:-}
    volumes:
      - ${LEONAID_BACKUP_MANIFEST_PATH:?LEONAID_BACKUP_MANIFEST_PATH fehlt}:/run/leonaid-monitor/backup-manifest.json:ro
      - ${LEONAID_MONITORED_DISK_PATH:?LEONAID_MONITORED_DISK_PATH fehlt}:/run/leonaid-monitor/disk:ro
    networks:
      - edge
      - telemetry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health/live', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 20

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../observability/pilot/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/pilot/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - telemetry
    depends_on:
      pilot-exporter:
        condition: service_healthy

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: ["monitoring"]
    logging: *default-logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/pilot/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${LEONAID_ALERT_WEBHOOK_URL_FILE:?LEONAID_ALERT_WEBHOOK_URL_FILE fehlt}:/run/secrets/alert-webhook-url:ro
      - ${LEONAID_ALERT_HEARTBEAT_URL_FILE:?LEONAID_ALERT_HEARTBEAT_URL_FILE fehlt}:/run/secrets/alert-heartbeat-url:ro
      - alertmanager-data:/alertmanager
    networks:
      - telemetry

networks:
  # The only egress of the mail senders (core worker, twenty-worker); no
  # other service joins it.
  mail-egress: {}

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
