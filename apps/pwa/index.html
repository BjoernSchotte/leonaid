<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d2240" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LeonAid Arbeitsbereich für Akquisiteure"
    />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" href="/app/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.svg" />
    <title>LeonAid Akquise</title>
    <script>
      (() => {
        const preference = localStorage.getItem("leonaid.theme") ?? "system";
        const resolved =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
