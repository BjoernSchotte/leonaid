<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d2240" />
    <title>LeonAid ist offline</title>
    <style>
      :root {
        color: #0d2240;
        background: #f5f7fb;
        font-family:
          "Avenir Next", Avenir, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: max(1rem, env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
        place-items: center;
      }
      main {
        display: grid;
        width: min(100%, 31rem);
        gap: 0.8rem;
        padding: clamp(1.4rem, 5vw, 2.2rem);
        border: 1px solid #d9dee8;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 14px 35px rgb(13 34 64 / 0.1);
      }
      .mark {
        display: grid;
        width: 2.7rem;
        height: 2.7rem;
        place-items: center;
        border-radius: 0.7rem;
        color: #0d2240;
        background: #ebb700;
        font-weight: 820;
      }
      p,
      h1 {
        margin: 0;
      }
      h1 {
        margin-top: 0.5rem;
        font-size: 1.8rem;
        letter-spacing: -0.04em;
      }
      p {
        color: #55565a;
        line-height: 1.6;
      }
      button {
        min-height: 2.9rem;
        margin-top: 0.5rem;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 0.7rem;
        color: #fff;
        background: #00338d;
        font: inherit;
        font-weight: 740;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #407cca;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" class="mark">L</div>
      <h1>Gerade keine Verbindung</h1>
      <p>
        LeonAid speichert bewusst keine Formulare offline. Stelle die Verbindung
        wieder her und lade den Arbeitsbereich neu; so entstehen keine doppelten
        Aktivitäten oder Bestellungen.
      </p>
      <button type="button" onclick="window.location.reload()">
        Verbindung erneut prüfen
      </button>
    </main>
  </body>
</html>
