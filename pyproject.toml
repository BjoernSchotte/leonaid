[project]
name = "leonaid"
version = "0.0.0"
description = "LeonAid PoC application core"
license = "LicenseRef-Undefined"
license-files = ["LICENSE"]
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "boto3==1.39.16",
  "cryptography==50.0.2",
  "dnspython==2.9.1",
  "email-validator==2.2.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "idna==3.18",
  "openfeature-sdk==0.10.0",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.9",
  "pypdf==6.21.4",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.33",
  "sqlalchemy==2.0.41",
  "starlette==1.10.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.10.1",
  "pymupdf==1.26.3",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "ruff==0.12.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
