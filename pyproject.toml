[project]
name = "leonaid"
version = "0.0.0"
description = "LeonAid PoC application core"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "authlib==1.6.1",
  "boto3==1.39.16",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "tenacity==9.1.2",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
