# Surveys use the admin and public frontends. The PWA is covered by its own E2E
# jobs. Survey stacks have no CRM key, so the API does not wait for Twenty and
# Twenty never starts (decision E-031); readiness still checks the database
# and storage.
services:
  api:
    depends_on: !override
      core-volume-init:
        condition: service_completed_successfully
      survey-validator:
        condition: service_healthy
      core-postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
  proxy:
    depends_on: !override
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      public:
        condition: service_healthy
