# Applied only after initial migration/provisioning. The reset restores the same
# initialized databases and Valkey (Redis-protocol) jobs with the same pinned images.
services:
  api:
    healthcheck:
      interval: 1s
      retries: 100
  proxy:
    healthcheck:
      interval: 1s
      retries: 100
  worker:
    healthcheck:
      interval: 1s
      retries: 100
  web:
    healthcheck:
      interval: 1s
      retries: 100
  pwa:
    healthcheck:
      interval: 1s
      retries: 100
  public:
    healthcheck:
      interval: 1s
      retries: 100
  core-postgres:
    healthcheck:
      interval: 1s
      retries: 100
  twenty-postgres:
    # Autovacuum analyzes the fixture's never-analyzed Twenty tables about
    # 20 s after each start: about 20 write transactions that are no leaf's.
    # Off, an idle Twenty keeps one state (tools/testing/twenty_state.py).
    # Test stacks only; production keeps autovacuum. This replaces the whole
    # command of infra/compose/compose.yml: copy any flags added there.
    command: ["postgres", "-c", "autovacuum=off"]
    healthcheck:
      interval: 1s
      retries: 100
  twenty-redis:
    healthcheck:
      interval: 1s
      retries: 100
  mailpit:
    healthcheck:
      interval: 1s
      retries: 100
  rustfs:
    healthcheck:
      interval: 1s
      retries: 100
  survey-validator:
    healthcheck:
      interval: 1s
      retries: 100
  twenty-server:
    healthcheck:
      interval: 1s
      retries: 300
    environment:
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
