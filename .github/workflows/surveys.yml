name: Survey acceptance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Test selection
        type: choice
        options: [all, pr, nightly]
        default: all

permissions:
  contents: read

concurrency:
  group: survey-acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    uses: ./.github/workflows/select-suites.yml

  fixture:
    needs: select
    if: needs.select.outputs.surveys == 'true'
    uses: ./.github/workflows/test-fixture.yml

  inventory:
    needs: select
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.manifest.outputs.groups }}
      shards: ${{ steps.manifest.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify run-local image isolation
        run: python3 tools/surveys/image_cache_test.py
      - name: Read the same group inventory as the local aggregate
        id: manifest
        env:
          CI_SUITE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.suite || 'pr' }}
          # tools/ci/select_suites.py: survey inputs changed, or not a PR.
          SELECTED: ${{ needs.select.outputs.surveys }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import tools.surveys.gate as gate
          import os
          manifest = gate.load_manifest(pathlib.Path('.'))
          shards = gate.ci_shards(manifest, os.environ['CI_SUITE'])
          if os.environ['SELECTED'] != 'true':
              shards = []
          print('groups=' + json.dumps(manifest['groups']))
          print('shards=' + json.dumps(shards))
          PY

  surveys:
    name: Survey shard / ${{ matrix.shard }}
    needs: [inventory, fixture]
    if: needs.inventory.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Leave capacity for main CI and the API/pin workflows.
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.inventory.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          targets: ${{ matrix.shard == 'foundation' && 'survey-foundation' || ((matrix.shard == 'journeys' || startsWith(matrix.shard, 'foundation-')) && 'default' || 'survey-runtime') }}
          bootstrap: ${{ matrix.shard == 'foundation' && 'toolchains' || 'browser' }}
      - name: Use prepared synthetic data
        if: matrix.shard != 'foundation'
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Execute each assigned check once with fresh owned service state
        env:
          SURVEY_GATE_SHARD: ${{ matrix.shard }}
        # Proofs contain credentials and remain mode 0600. Linux bind mounts
        # preserve container-root ownership; the controller must share that UID.
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo --preserve-env=CI,BUILDX_BUILDER,DOCKER_CONFIG,LEONAID_CI_FIXTURE ./leonaid test-surveys --shard "$SURVEY_GATE_SHARD"
      - name: Collect bounded diagnostic metadata
        if: always()
        run: |
          python3 tools/surveys/ci_diagnostics_test.py
          sudo python3 tools/surveys/ci_diagnostics.py .
          mkdir -p "$RUNNER_TEMP/surveys-ci-results"
          sudo find .artifacts/surveys-gate/results -maxdepth 1 -type f -name '*.json' -exec cp '{}' "$RUNNER_TEMP/surveys-ci-results/" \;
          sudo cp .artifacts/surveys-gate/results/diagnostics/metadata.json "$RUNNER_TEMP/surveys-ci-results/diagnostics.json"
          sudo chmod 644 "$RUNNER_TEMP/surveys-ci-results/"*.json
      - name: Publish structured results only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveys-${{ matrix.shard }}
          path: ${{ runner.temp }}/surveys-ci-results/*.json
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Surveys / ${{ matrix.group }}
    needs: [inventory, surveys]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        group: ${{ fromJSON(needs.inventory.outputs.groups || '["foundation","integration","editor","responses","exports","recovery","package","e2e"]') }}
    steps:
      - name: Require every scheduled survey shard
        # These are policy summaries. Nightly-only checks are not claimed as
        # executed by a PR run; inventory validates the complete partition.
        # An unselected PR schedules no shard, which must then be skipped.
        env:
          INVENTORY: ${{ needs.inventory.result }}
          SELECTED: ${{ needs.inventory.outputs.shards != '[]' }}
          RESULT: ${{ needs.surveys.result }}
        run: |
          test "$INVENTORY" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi

  backup-recovery:
    name: Nightly backup / ${{ matrix.command }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        command:
          - test-backup
          - test-upgrade
          - test-pilot-backup
          - test-pilot-deployment
          - test-pilot-install
          - test-pilot-import
          - test-pilot-release
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/${{ matrix.command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run isolated backup and recovery proof
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: bash tools/ci/run-job.sh "$TEST_COMMAND" ./leonaid "$TEST_COMMAND"
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.command }}
          path: .artifacts/ci/${{ matrix.command }}
          if-no-files-found: error
          retention-days: 14

  gate:
    # The one required check of this workflow (branch protection and merge
    # queue): tools/ci/gate.py.
    name: Survey gate
    needs: [select, fixture, inventory, surveys, acceptance, backup-recovery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected survey job
        env:
          NEEDS: ${{ toJSON(needs) }}
        # backup-recovery runs only nightly or on dispatch; when it runs it
        # must pass.
        run: >-
          python3 tools/ci/gate.py --name "Survey gate"
          --selectable fixture=surveys
          --selectable surveys=surveys
          --may-skip backup-recovery
