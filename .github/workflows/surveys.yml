name: Survey acceptance
# The nightly run (recovery shards and backup proofs) is the only one with
# those checks; its own name lets nightly-watchdog.yml track it apart from
# the post-merge runs.
run-name: ${{ github.event.schedule == '17 1 * * *' && 'Survey acceptance nightly (recovery and backup)' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Survey acceptance post-merge' || github.event.pull_request.title || github.workflow }}

on:
  pull_request:
    # Only events that change what is tested; a title, label or draft
    # change starts no run (the gate of the last run stays). A draft runs
    # nothing and its gate fails; ready_for_review starts CI.
    types: [opened, reopened, synchronize, ready_for_review]
  # Post-merge: every push to main runs the PR shards when survey inputs
  # changed since the last green run there; post-merge runs are never
  # cancelled (E-019). The nightly schedule runs the recovery shards and
  # backup proofs.
  push:
    branches:
      - main
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Test selection
        type: choice
        options: [all, pr, nightly]
        default: all

permissions:
  contents: read

concurrency:
  group: survey-acceptance-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/select-suites.yml
    # actions: read finds the last green run on main for the post-merge diff.
    permissions:
      actions: read
      contents: read
    with:
      post-merge: true

  fixture:
    needs: select
    if: needs.select.outputs.surveys == 'true'
    uses: ./.github/workflows/test-fixture.yml
    # ci.yml builds the same fixture key on a cache miss; wait for its upload
    # instead of building it twice (test-fixture.yml peer-wait-minutes).
    permissions:
      actions: read
      contents: read
    with:
      peer-wait-minutes: 10

  inventory:
    needs: select
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.manifest.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify run-local image isolation
        run: python3 tools/surveys/image_cache_test.py
      - name: Read the same group inventory as the local aggregate
        id: manifest
        env:
          CI_SUITE: ${{ github.event.schedule == '17 1 * * *' && 'nightly' || inputs.suite || 'pr' }}
          # tools/ci/select_suites.py: survey inputs changed, or not a PR.
          SELECTED: ${{ needs.select.outputs.surveys }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import tools.surveys.gate as gate
          import os
          manifest = gate.load_manifest(pathlib.Path('.'))
          shards = gate.ci_shards(manifest, os.environ['CI_SUITE'])
          if os.environ['SELECTED'] != 'true':
              shards = []
          print('shards=' + json.dumps(shards))
          PY

  surveys:
    name: Survey shard / ${{ matrix.shard }}
    needs: [inventory, fixture]
    if: needs.inventory.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.inventory.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          # The foundation shard needs only the API and validator images; every
          # other shard may start the browser journeys, which need the PWA too.
          targets: ${{ matrix.shard == 'foundation' && 'survey-foundation' || 'default' }}
          bootstrap: ${{ matrix.shard == 'foundation' && 'toolchains' || 'browser' }}
      - name: Use prepared synthetic data
        if: matrix.shard != 'foundation'
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Execute each assigned check once with fresh owned service state
        env:
          SURVEY_GATE_SHARD: ${{ matrix.shard }}
        # Proofs contain credentials and remain mode 0600. Linux bind mounts
        # preserve container-root ownership; the controller must share that UID.
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo --preserve-env=CI,BUILDX_BUILDER,DOCKER_CONFIG,LEONAID_CI_FIXTURE ./leonaid test-surveys --shard "$SURVEY_GATE_SHARD"
      - name: Collect bounded diagnostic metadata
        if: always()
        run: |
          python3 tools/surveys/ci_diagnostics_test.py
          sudo python3 tools/surveys/ci_diagnostics.py .
          mkdir -p "$RUNNER_TEMP/surveys-ci-results"
          sudo find .artifacts/surveys-gate/results -maxdepth 1 -type f -name '*.json' -exec cp '{}' "$RUNNER_TEMP/surveys-ci-results/" \;
          sudo cp .artifacts/surveys-gate/results/diagnostics/metadata.json "$RUNNER_TEMP/surveys-ci-results/diagnostics.json"
          sudo chmod 644 "$RUNNER_TEMP/surveys-ci-results/"*.json
      # Failing test names, assertion messages and the last service lines of
      # every failed check, redacted and PII-checked by
      # tools/ci/sanitize_artifacts.py; a check with personal data is withheld.
      - name: Print sanitized failure excerpts
        if: failure()
        # Its self-test runs in "Lint and types" (tools/ci/lint-types.sh).
        run: sudo --preserve-env=LEONAID_CI_FIXTURE python3 tools/surveys/ci_failure_excerpt.py . "$RUNNER_TEMP/surveys-ci-results/failure-excerpts.json"
      - name: Publish structured results and sanitized excerpts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveys-${{ matrix.shard }}
          path: ${{ runner.temp }}/surveys-ci-results/*.json
          if-no-files-found: error
          retention-days: 14

  backup-recovery:
    name: Nightly backup / ${{ matrix.command }}
    if: github.event.schedule == '17 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        command:
          - test-backup
          - test-upgrade
          - test-pilot-backup
          - test-pilot-deployment
          - test-pilot-install
          - test-pilot-import
          - test-pilot-release
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/${{ matrix.command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Bootstrap pinned Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run isolated backup and recovery proof
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: bash tools/ci/run-job.sh "$TEST_COMMAND" ./leonaid "$TEST_COMMAND"
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.command }}
          path: .artifacts/ci/${{ matrix.command }}
          if-no-files-found: error
          retention-days: 14

  gate:
    # The one required check of this workflow (repository ruleset):
    # tools/ci/gate.py. In the fast tier it requires the selector and no
    # shard; full-ci, post-merge and nightly runs require every shard.
    name: Survey gate
    needs: [select, fixture, inventory, surveys, backup-recovery]
    if: ${{ always() }}
    permissions:
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected survey job
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Pull request context for tools/ci/gate.py: drafts fail.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # A stacked result never passes (tools/ci/gate.py stacked).
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_NAME: Survey gate
          # A fast run never satisfies the gate while the PR carries full-ci.
          FULL_CI_GATE: "true"
        # backup-recovery runs only nightly or on dispatch; when it runs it
        # must pass.
        run: >-
          python3 tools/ci/gate.py --name "Survey gate"
          --selectable fixture=surveys
          --selectable surveys=surveys
          --may-skip backup-recovery
