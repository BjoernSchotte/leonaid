name: Prepare synthetic test fixture
on:
  workflow_call:
    inputs:
      peer-wait-minutes:
        # A second workflow of the same push (surveys.yml) waits this long
        # for ci.yml's fixture job to upload the same key before building
        # it again; 0 builds at once. Needs actions: read in the caller.
        description: Minutes to wait for another workflow's identical fixture
        type: number
        default: 0
    outputs:
      key:
        value: ${{ jobs.fixture.outputs.key }}
# The caller caps these; actions: read is needed for the Actions API
# (runs, caches), which only answers without it for a public repository.
permissions:
  actions: read
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: echo "value=fixture-v1-$(python3 tools/testing/ci_fixture.py key)" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Wait for the same fixture from another workflow of this push
        id: peer
        if: steps.cached.outputs.cache-hit != 'true' && inputs.peer-wait-minutes > 0
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.value }}
          MINUTES: ${{ inputs.peer-wait-minutes }}
        # Only an exact key on this ref counts; a missing cache after the
        # wait builds it here, so a failed peer never blocks this workflow.
        run: |
          # A failing API call (missing actions: read made every poll fail
          # before, so each miss waited the full time) is logged, once.
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          errors=$(mktemp)
          reported=false
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! found=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$KEY&ref=$GITHUB_REF" \
              --jq "[.actions_caches[] | select(.key == \"$KEY\")] | length" 2>"$errors"); then
              found=0
              if [ "$reported" = false ]; then
                echo "::warning title=Fixture peer wait::cache lookup failed: $(head -c 300 "$errors")"
                reported=true
              fi
            fi
            if [ "${found:-0}" -gt 0 ]; then
              echo "Fixture $KEY was uploaded by another workflow; reusing it"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "No peer upload of $KEY within $MINUTES minutes; building it here"
      - name: Start freeing runner disk from unused toolchains
        if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        run: sh tools/ci/free-runner-disk.sh start
      - if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        uses: ./.github/actions/build-cache
      - name: Finish freeing runner disk
        if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        run: sh tools/ci/free-runner-disk.sh wait
      - if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        name: Build an isolated synthetic fixture from repository inputs
        run: python3 tools/testing/ci_fixture.py build "$RUNNER_TEMP/leonaid-synthetic-fixture"
      # A failed upload (GitHub cache 429) only warns; every consumer would
      # then miss the key. Verify the upload and retry it once.
      - if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
      - id: saved
        if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Back off before retrying the fixture upload
        if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true' && steps.saved.outputs.cache-hit != 'true'
        run: |
          echo "::warning title=Infrastructure retry::Fixture cache upload is missing; retrying once in 30s"
          sleep 30
      - if: steps.cached.outputs.cache-hit != 'true' && steps.peer.outputs.found != 'true' && steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
