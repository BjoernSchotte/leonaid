name: Prepare synthetic test fixture
on:
  workflow_call:
    outputs:
      key:
        value: ${{ jobs.fixture.outputs.key }}
# The caller caps these; actions: read is needed for the Actions API
# (runs, caches), which only answers without it for a public repository.
permissions:
  actions: read
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: echo "value=fixture-v1-$(python3 tools/testing/ci_fixture.py key)" >> "$GITHUB_OUTPUT"
      - id: cached
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Start freeing runner disk from unused toolchains
        if: steps.cached.outputs.cache-hit != 'true'
        run: sh tools/ci/free-runner-disk.sh start
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-cache
      - name: Finish freeing runner disk
        if: steps.cached.outputs.cache-hit != 'true'
        run: sh tools/ci/free-runner-disk.sh wait
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Build an isolated synthetic fixture from repository inputs
        run: python3 tools/testing/ci_fixture.py build "$RUNNER_TEMP/leonaid-synthetic-fixture"
      # A failed upload (GitHub cache 429) only warns; every consumer would
      # then miss the key. Verify the upload and retry it once.
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
      - id: saved
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
          lookup-only: true
      - name: Back off before retrying the fixture upload
        if: steps.cached.outputs.cache-hit != 'true' && steps.saved.outputs.cache-hit != 'true'
        run: |
          echo "::warning title=Infrastructure retry::Fixture cache upload is missing; retrying once in 30s"
          sleep 30
      - if: steps.cached.outputs.cache-hit != 'true' && steps.saved.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/leonaid-synthetic-fixture
          key: ${{ steps.key.outputs.value }}
