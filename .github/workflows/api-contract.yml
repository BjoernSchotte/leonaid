name: API contract

on:
  pull_request:
    paths:
      - ".github/workflows/api-contract.yml"
      - "apps/**"
      - "packages/api-client/**"
      - "packages/features/**"
      - "src/leonaid/**"
      - "tests/contract/**"
      - "tests/unit/**"
      - "tools/openapi/**"
      - "infra/compose/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "bun.lock"
      - "specs/leonaid-poc/openapi-breaking-approvals.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-contract.yml"
      - "apps/**"
      - "packages/api-client/**"
      - "packages/features/**"
      - "src/leonaid/**"
      - "tests/contract/**"
      - "tests/unit/**"
      - "tools/openapi/**"
      - "infra/compose/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "bun.lock"
      - "specs/leonaid-poc/openapi-breaking-approvals.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Generated client against real API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Bootstrap locked Docker toolchains
        run: ./leonaid bootstrap

      - name: Generate, typecheck and run real contract
        run: ./tools/openapi/test.sh "$PWD"

      - name: Checkout pull-request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base

      - name: Reject unapproved breaking changes
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm
          -e PYTHONPATH=/workspace/src
          -v "$PWD:/workspace:ro"
          -w /workspace
          ghcr.io/astral-sh/uv:0.8.5-python3.13-bookworm-slim@sha256:72943d818a2fa37faa5cfeb37d7afbfcafc405ed072bdac5c80cbce5e8dc5018
          uv run --frozen --no-sync
          python tools/openapi/breaking.py
          .ci-base/packages/api-client/openapi.json
          packages/api-client/openapi.json
          specs/leonaid-poc/openapi-breaking-approvals.json
