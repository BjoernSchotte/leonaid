name: API contract

# Formerly path-filtered. tools/ci/select_suites.py keeps the same filter
# (API_PATHS) for pull requests, so "API contract gate" always reports;
# push and dispatch run the contract unconditionally.
on:
  pull_request:
    # Drafts run nothing (their gate fails); ready_for_review starts CI,
    # converted_to_draft cancels the running one. edited: a base change (a
    # stacked PR retargeted to main) runs the normal selection; a title or
    # body edit runs no job and its gate mirrors the commit's real result.
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}-${{ github.event.schedule }}${{ ((github.event.action == 'edited' && !github.event.changes.base) || (github.event.pull_request.draft && github.event.action != 'converted_to_draft')) && format('-mirror-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base)
    uses: ./.github/workflows/select-suites.yml
    # A called workflow may not request more than its caller grants
    # (select-suites.yml and test-fixture.yml read the Actions API).
    permissions:
      actions: read
      contents: read

  contract:
    name: Generated client against real API
    needs: select
    if: needs.select.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain bootstrap and the Twenty image pull (the contract stack
      # starts Twenty; about 50 s of pulls otherwise) run beside the import.
      - name: Reuse persistent Core build layers
        uses: ./.github/actions/build-cache
        with:
          targets: api
          bootstrap: seed

      - name: Generate, typecheck and run real contract
        run: ./tools/openapi/test.sh "$PWD"

      - name: Checkout pull-request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base

      - name: Reject unapproved breaking changes
        if: github.event_name == 'pull_request'
        # Image from images.env: workflows carry no digests, so the
        # GITHUB_TOKEN of pin-drift.yml can re-pin without workflow scope.
        run: >-
          . infra/locks/images.env &&
          docker run --rm
          -e PYTHONPATH=/workspace/src
          -v "$PWD:/workspace:ro"
          -w /workspace
          "$UV_IMAGE"
          uv run --frozen --no-sync
          python tools/openapi/breaking.py
          .ci-base/packages/api-client/openapi.json
          packages/api-client/openapi.json
          specs/leonaid-poc/openapi-breaking-approvals.json

  gate:
    # The one required check of this workflow: tools/ci/gate.py.
    name: API contract gate
    needs: [select, contract]
    if: ${{ always() }}
    permissions:
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require the selected contract run
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Pull request context for tools/ci/gate.py: drafts fail, title
          # edits mirror the commit's newest completed real gate (or fail
          # fast), a stacked result never passes.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ toJSON(github.event.changes.base) != 'null' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_BASE: ${{ github.base_ref }}
          GATE_NAME: API contract gate
        run: python3 tools/ci/gate.py --name "API contract gate" --selectable contract=api
