name: Nightly watchdog

# Scheduled runs on main have no pull request that shows their result. This
# keeps one open issue per scheduled workflow while its latest scheduled run
# on main is not green or is overdue, and closes it after a green run.
# Documentation publication has its own watchdog (docs-watchdog.yml).
# tools/ci/workflow_contract.py requires every other scheduled workflow here.
on:
  workflow_run:
    workflows:
      [
        LeonAid CI,
        Survey acceptance,
        Dependency pins,
        Image pin drift,
        Refit CI timings,
      ]
    types: [completed]
  # Also catches a schedule that stopped firing or a missed workflow_run.
  schedule:
    - cron: "53 9 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

concurrency:
  group: nightly-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    name: Alert or resolve scheduled failures
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # workflow file:maximum hours since its last scheduled run on main.
      # workflow file:maximum hours since its last scheduled run on main
      # [:word the run title must contain]. ci.yml and surveys.yml run on
      # main every 3 hours (no push runs); their nightly runs (ci.yml: every
      # E2E leaf; surveys.yml: recovery and backup) are tracked on their own.
      # Runs after every completed scheduled run (workflow_run), not daily.
      WATCHED: "ci.yml:8 ci.yml:30:nightly surveys.yml:8 surveys.yml:30:nightly pin-drift.yml:30 pins.yml:192 refit-timings.yml:192"
    steps:
      - name: Check the latest scheduled run of each workflow and maintain alerts
        run: |
          set -eu
          now=$(date -u +%s)
          for entry in $WATCHED; do
            workflow=${entry%%:*}
            rest=${entry#*:}
            hours=${rest%%:*}
            word=
            label=$workflow
            if [ "$rest" != "$hours" ]; then
              word=${rest#*:}
              label="$workflow ($word)"
            fi
            title="[nightly-watchdog] $label scheduled run needs attention"
            latest=$(WORD="$word" gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=schedule&status=completed&per_page=30" \
              --jq '[.workflow_runs[] | select(env.WORD == "" or (.display_title | contains(env.WORD)))][0] // empty | [.id, .conclusion, .created_at, .html_url] | @tsv')
            problem=
            if [ -z "$latest" ]; then
              # A newly added schedule has nothing to report yet.
              echo "nightly-watchdog: $label has no completed scheduled run on main yet"
              continue
            fi
            id=$(printf '%s' "$latest" | cut -f1)
            conclusion=$(printf '%s' "$latest" | cut -f2)
            created=$(printf '%s' "$latest" | cut -f3)
            url=$(printf '%s' "$latest" | cut -f4)
            if [ "$conclusion" != success ]; then
              failed=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .name')
              problem=$(printf 'The scheduled run %s of %s on main ended with %s (started %s).\n\nFailed jobs:\n%s' \
                "$url" "$label" "$conclusion" "$created" "${failed:-- none reported}")
            elif [ "$(( now - $(date -u -d "$created" +%s) ))" -gt "$(( hours * 3600 ))" ]; then
              problem="The last scheduled run of $label on main ($url, $created) is older than $hours hours; the schedule may have stopped."
            fi

            issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
              --jq "[.[] | select(.pull_request == null and .title == \"$title\")][0].number // empty")
            if [ -n "$problem" ] && [ -z "$issue" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --body "$problem

          This issue closes itself after the next green scheduled run of $label on main."
            elif [ -n "$problem" ]; then
              # One comment per failed run: skip a run this issue already reports.
              reported=$({
                gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.body'
                gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body'
              } | grep -cF "$url" || true)
              if [ "$reported" -eq 0 ]; then
                gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$problem"
              fi
            elif [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "The latest scheduled run of $label on main is green again: $url"
            fi
          done
