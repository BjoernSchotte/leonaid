name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bilingual site artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEONAID_DOCS_ARTIFACT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      LEONAID_DOCS_BASE_PATH: /leonaid
      LEONAID_DOCS_REVISION: ${{ github.sha }}
      LEONAID_DOCS_SITE_URL: https://bjoernschotte.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record reproducible build metadata
        run: echo "LEONAID_DOCS_BUILT_AT=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Bootstrap locked toolchains
        run: ./leonaid bootstrap

      - name: Validate content, translations, links and API source
        run: ./leonaid docs-check

      - name: Build allowlisted static artifact and manifest
        run: ./leonaid docs-build

      - name: Prove the production build in Chromium
        run: ./leonaid test-docs

      - name: Publish browser evidence
        if: ${{ always() && hashFiles('.artifacts/docs/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/docs
          if-no-files-found: error
          retention-days: 14

      - name: Publish complete documentation site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 14

      - name: Stage GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy and smoke GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy tested artifact atomically
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Checkout smoke-test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bootstrap locked toolchains
        run: ./leonaid bootstrap

      - name: Smoke deployed revision
        env:
          LEONAID_DOCS_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          LEONAID_DOCS_EXPECTED_REVISION: ${{ github.sha }}
        run: ./leonaid test-docs

      - name: Publish live-smoke evidence
        if: ${{ always() && hashFiles('.artifacts/docs/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/docs
          if-no-files-found: error
          retention-days: 14
