name: Dependency pins

# Formerly path-filtered. tools/ci/select_suites.py keeps the same filter
# (PINS_PATHS) for pull requests, so "Dependency pins gate" always reports;
# push, schedule and dispatch run every job.
on:
  pull_request:
    # Drafts run nothing; ready_for_review starts CI, converted_to_draft
    # cancels the running one (same concurrency group, no job runs).
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/select-suites.yml

  policy:
    name: Reject dependency drift
    needs: select
    if: needs.select.outputs.pins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull the pinned Python image
        run: |
          . infra/locks/images.env
          sh tools/ci/retry-infra.sh docker pull "$PYTHON_IMAGE"

      - name: Verify exact pins and rejection cases
        run: |
          . infra/locks/images.env
          docker run --rm -v "$PWD:/workspace:ro" "$PYTHON_IMAGE" \
            /bin/sh /workspace/tools/pins/test.sh /workspace
          docker run --rm -v "$PWD:/workspace:ro" "$PYTHON_IMAGE" \
            python /workspace/tools/security/vuln_policy.py check /workspace

  reproducibility:
    name: Install frozen locks twice
    needs: select
    if: needs.select.outputs.pins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install two isolated index checkouts
        run: /bin/sh tools/pins/reproduce.sh "$PWD"

      - name: Execute pinned toolchains and browser artifacts
        run: /bin/sh tools/pins/verify-runtime-versions.sh "$PWD"

      # Recorded digests must still resolve; a tag moved by an upstream rebuild
      # does not fail here (pin-drift.yml re-pins it). Pins this change adds
      # or alters must equal what their tag resolves to now. Other events
      # compare with main, so a dispatched re-pin branch is checked strictly.
      - name: Verify registry digests and changed tag mappings
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE ;;
            *) base=main ;;
          esac
          git fetch --no-tags --depth=1 origin "$base"
          /bin/sh tools/pins/verify-image-digests.sh "$PWD" FETCH_HEAD

  sbom:
    name: Generate dependency and image SBOMs
    needs: select
    if: needs.select.outputs.pins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse persistent proxy build layers
        uses: ./.github/actions/build-cache
        with:
          targets: proxy

      - name: Generate CycloneDX artifacts
        run: /bin/sh tools/sbom/generate.sh "$PWD" "$PWD/.artifacts/sbom"

      - name: Publish CycloneDX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sboms
          path: .artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14

  gate:
    # The one required check of this workflow: tools/ci/gate.py.
    name: Dependency pins gate
    needs: [select, policy, reproducibility, sbom]
    # Skipped (and so passing) only for a draft, which cannot be merged.
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected pin job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci/gate.py --name "Dependency pins gate"
          --selectable policy=pins
          --selectable reproducibility=pins
          --selectable sbom=pins
