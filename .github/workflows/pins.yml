name: Dependency pins

on:
  pull_request:
    paths:
      - ".github/workflows/pins.yml"
      - ".tool-versions"
      - "bun.lock"
      - "infra/locks/**"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - "tools/pins/**"
      - "tools/sbom/**"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pins.yml"
      - ".tool-versions"
      - "bun.lock"
      - "infra/locks/**"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - "tools/pins/**"
      - "tools/sbom/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Reject dependency drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify exact pins and rejection cases
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          docker.io/library/python:3.13.5-slim-bookworm@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419
          /bin/sh /workspace/tools/pins/test.sh /workspace

  reproducibility:
    name: Install frozen locks twice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install two isolated index checkouts
        run: /bin/sh tools/pins/reproduce.sh "$PWD"

      - name: Execute pinned toolchains and browser artifacts
        run: /bin/sh tools/pins/verify-runtime-versions.sh "$PWD"

      - name: Verify registry tag-to-digest mappings
        run: /bin/sh tools/pins/verify-image-digests.sh "$PWD"

  sbom:
    name: Generate dependency and image SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate CycloneDX artifacts
        run: /bin/sh tools/sbom/generate.sh "$PWD" "$PWD/.artifacts/sbom"

      - name: Publish CycloneDX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-sboms
          path: .artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14
