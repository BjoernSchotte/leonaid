name: Dependency pins

on:
  pull_request:
    paths:
      - ".github/workflows/pins.yml"
      - ".tool-versions"
      - "bun.lock"
      - "infra/locks/**"
      - "infra/security/**"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - "tools/pins/**"
      - "tools/security/vuln_policy*.py"
      - "tools/sbom/**"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pins.yml"
      - ".tool-versions"
      - "bun.lock"
      - "infra/locks/**"
      - "infra/security/**"
      - "package.json"
      - "pyproject.toml"
      - "renovate.json"
      - "tools/pins/**"
      - "tools/security/vuln_policy*.py"
      - "tools/sbom/**"
      - "uv.lock"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Reject dependency drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact pins and rejection cases
        run: |
          . infra/locks/images.env
          docker run --rm -v "$PWD:/workspace:ro" "$PYTHON_IMAGE" \
            /bin/sh /workspace/tools/pins/test.sh /workspace
          docker run --rm -v "$PWD:/workspace:ro" "$PYTHON_IMAGE" \
            python /workspace/tools/security/vuln_policy.py check /workspace

  reproducibility:
    name: Install frozen locks twice
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install two isolated index checkouts
        run: /bin/sh tools/pins/reproduce.sh "$PWD"

      - name: Execute pinned toolchains and browser artifacts
        run: /bin/sh tools/pins/verify-runtime-versions.sh "$PWD"

      - name: Verify registry tag-to-digest mappings
        run: /bin/sh tools/pins/verify-image-digests.sh "$PWD"

  sbom:
    name: Generate dependency and image SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reuse persistent proxy build layers
        uses: ./.github/actions/build-cache
        with:
          targets: proxy

      - name: Generate CycloneDX artifacts
        run: /bin/sh tools/sbom/generate.sh "$PWD" "$PWD/.artifacts/sbom"

      - name: Publish CycloneDX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sboms
          path: .artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14
