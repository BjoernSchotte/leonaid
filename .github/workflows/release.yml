name: Release

# Started by the annotated CalVer tag that ./leonaid release pushes, or by hand
# on such a tag (./leonaid release resumes this way). Builds and pushes the six
# LeonAid images, pins them as <name>:<version>@<digest>, creates the release
# manifest from the effective pilot Compose configuration and publishes the
# GitHub release with these files attached.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate the CalVer tag
        run: |
          git fetch --force --tags origin
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*(\.[1-9][0-9]*)?$'; then
            echo "::error::$TAG is not a CalVer release tag vYYYY.M.N[.P]"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != tag ]; then
            echo "::error::$TAG must be an annotated tag from ./leonaid release"
            exit 1
          fi
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "VERSION=${TAG#v}"
            echo "REGISTRY=ghcr.io/$owner/leonaid"
            echo "REVISION=$(git rev-parse "$TAG^{commit}")"
            echo "OUT=$RUNNER_TEMP/release"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/release"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Refuse to overwrite published images
        run: |
          for name in core web pwa public proxy survey-validator; do
            if docker buildx imagetools inspect "$REGISTRY/$name:$VERSION" >/dev/null 2>&1; then
              echo "::error::$REGISTRY/$name:$VERSION exists already; release tags and images are never replaced"
              exit 1
            fi
          done

      - name: Build and push release images
        run: >-
          docker buildx bake
          --file tools/release/docker-bake.hcl
          --push
          --metadata-file "$OUT/bake-metadata.json"

      - name: Pin image references
        run: |
          . infra/locks/images.env
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" -v "$OUT:/out" \
            "$PYTHON_IMAGE" \
            python /workspace/tools/release/release_assets.py images \
            --metadata /out/bake-metadata.json \
            --registry "$REGISTRY" --version "$VERSION" --commit "$REVISION" \
            --output /out/release-images.env
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace:ro" -v "$OUT:/out" \
            "$PYTHON_IMAGE" \
            python /workspace/tools/release/release_assets.py render-env \
            --template /workspace/infra/pilot/production.env.example \
            --images /out/release-images.env \
            --output /out/compose.env

      - name: Create the release manifest
        run: |
          . infra/locks/images.env
          docker compose \
            --env-file "$OUT/compose.env" \
            --file infra/compose/compose.yml \
            --file infra/pilot/compose.yml \
            config --format json > "$OUT/compose-config.json"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e PYTHONPATH=/workspace \
            -v "$PWD:/workspace:ro" -v "$OUT:/out" \
            "$PYTHON_IMAGE" \
            python /workspace/tools/pilot_release/manifest.py create \
            --root /workspace \
            --release-id "leonaid-$VERSION" \
            --version "$VERSION" \
            --git-commit "$REVISION" \
            --deployment-mode production \
            --compose-config /out/compose-config.json \
            --output /out/release-manifest.json
          (cd "$OUT" && sha256sum release-images.env release-manifest.json > SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(git tag -l --format='%(contents:body)' "$TAG")
          {
            printf '%s\n\n' "$notes"
            echo "### Deploy"
            echo
            echo "Copy \`release-images.env\` into the production env file and follow"
            echo "the release runbook with \`release-manifest.json\`."
            echo
            echo '```'
            cat "$OUT/release-images.env"
            echo '```'
          } > "$OUT/notes.md"
          latest=
          case "$VERSION" in *.*.*.*) latest=--latest=false ;; esac
          # shellcheck disable=SC2086 # empty or one flag on purpose
          gh release create "$TAG" \
            "$OUT/release-images.env" "$OUT/release-manifest.json" "$OUT/SHA256SUMS" \
            --verify-tag --title "LeonAid $VERSION" --notes-file "$OUT/notes.md" $latest
