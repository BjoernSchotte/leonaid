name: CI image cleanup

# Deletes prebuilt CI image versions on GHCR (decision E-020) that were
# created more than 30 days ago and carry no content hash of the current main
# commit (tools/ci/prebuilt_images.py cleanup). Tags that are no content hash
# are never touched. The self-test runs first; a dispatch is a dry run unless
# dry_run is unticked. nightly-watchdog.yml reports a red scheduled run.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-images-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete unreferenced prebuilt image versions
    # Main only: the hashes kept are those of main's checkout.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the cleanup rules
        run: python3 -I tools/ci/prebuilt_images_test.py
      - name: Delete unreferenced versions older than 30 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 -I tools/ci/prebuilt_images.py cleanup --dry-run
          else
            python3 -I tools/ci/prebuilt_images.py cleanup
          fi
