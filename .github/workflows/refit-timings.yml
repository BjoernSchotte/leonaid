name: Refit CI timings

# Weekly: refit the shard seconds of tools/ci/select_suites.py from the last
# successful nightly runs (tools/ci/refit_timings.py: median, outliers
# outside half to double rejected, only moves above 15 %) and open a pull
# request. A human merges it. Pull requests and pushes made with
# GITHUB_TOKEN start no workflows, so the required ones are dispatched on
# the branch, as in pin-drift.yml.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

# actions: read the nightly runs and their logs, and dispatch the required
# workflows (write); contents: push the branch; pull-requests: open the PR.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refit-timings
  cancel-in-progress: false

jobs:
  refit:
    name: Refit shard seconds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ci/refit-timings
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Refit the seconds tables from the last nightly runs
        run: >-
          python3 tools/ci/refit_timings.py "$PWD" --write
          --repository "$GITHUB_REPOSITORY"
          --summary "$RUNNER_TEMP/refit.md"

      - name: Check the refitted selector
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          python3 tools/ci/select_suites_test.py "$PWD"

      - name: Push the refit branch, open or update its pull request, start CI
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "refit-timings: no shard moved by more than 15 %"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit --quiet --all \
            --message "chore(ci): refit shard seconds from recent nightly runs" \
            --message "$(cat "$RUNNER_TEMP/refit.md")"
          if git fetch --no-tags --depth=1 origin "$BRANCH" 2>/dev/null &&
            [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "refit-timings: $BRANCH already carries this refit"
            exit 0
          fi
          # The branch belongs to this workflow and is rebuilt from main each run.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          {
            cat "$RUNNER_TEMP/refit.md"
            echo
            echo "Opened by .github/workflows/refit-timings.yml. The required workflows were"
            echo "dispatched on \`$BRANCH\`; their checks report on the head commit."
          } >"$RUNNER_TEMP/body.md"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(ci): refit shard seconds from recent nightly runs" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

          for workflow in ci.yml surveys.yml api-contract.yml pins.yml docs.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          done
