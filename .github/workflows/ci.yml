name: LeonAid CI

on:
  # PR tier: cheap gates plus only the stack suites whose inputs changed.
  pull_request:
  # Queue tier: the complete suite before anything reaches main.
  merge_group:
  push:
    branches:
      - main
      - ci-artifact-probe
  # Nightly complete run on main with a flake summary.
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      cold_run:
        description: Remove the ephemeral runner's Docker build cache first
        required: false
        type: boolean
        default: false
      artifact_probe:
        description: Run the intentionally failing artifact proof only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: leonaid-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    if: inputs.artifact_probe != true && github.ref != 'refs/heads/ci-artifact-probe'
    uses: ./.github/workflows/select-suites.yml

  fixture:
    if: inputs.cold_run != true && inputs.artifact_probe != true && github.ref != 'refs/heads/ci-artifact-probe'
    uses: ./.github/workflows/test-fixture.yml

  lint-types:
    if: github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/lint-types
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run lint, type and contract-generation checks
        run: bash tools/ci/run-job.sh lint-types bash tools/ci/lint-types.sh
      - name: Publish lint and type evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lint-types
          path: .artifacts/ci/lint-types
          if-no-files-found: error
          retention-days: 14

  unit:
    if: github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/unit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run unit tests with real domain objects
        run: bash tools/ci/run-job.sh unit ./leonaid test-unit
      - name: Publish unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-unit
          path: .artifacts/ci/unit
          if-no-files-found: error
          retention-days: 14

  integration-shards:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.integration != '[]' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Integration / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # Shards and order (long jobs first): tools/ci/select_suites.py
        # INTEGRATION_SHARDS. GitHub creation order is not a start guarantee.
        shard: ${{ fromJSON(needs.select.outputs.integration) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/integration-${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ contains(fromJSON('["seed-cold","seed-reset","compose","twenty-install"]'), matrix.shard) && 'seed' || 'toolchains' }}
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          case "$TEST_SHARD" in
            seed-cold|seed-reset) sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh seed ;;
            *) sh tools/ci/retry-infra.sh ./leonaid bootstrap ;;
          esac
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Run real service integration suite
        run: bash tools/ci/run-job.sh integration-${{ matrix.shard }} bash tools/ci/integration.sh ${{ matrix.shard }}
      - name: Publish integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integration-${{ matrix.shard }}
          path: .artifacts/ci/integration-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration
    needs: [select, integration-shards]
    if: ${{ !cancelled() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected integration shard
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.integration != '[]' }}
          RESULT: ${{ needs.integration-shards.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi

  contract:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.contract == 'true' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/contract
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Run OpenAPI and cross-system contracts
        run: bash tools/ci/run-job.sh contract bash tools/ci/contract.sh
      - name: Publish contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-contract
          path: .artifacts/ci/contract
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.e2e != '[]' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: E2E leaf / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        # Shards: tools/ci/select_suites.py E2E_SHARDS.
        shard: ${{ fromJSON(needs.select.outputs.e2e) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/e2e-${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: browser
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Run real browser shard
        run: >-
          bash tools/ci/run-job.sh
          e2e-${{ matrix.shard }}
          bash tools/ci/e2e.sh ${{ matrix.shard }}
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-${{ matrix.shard }}
          path: .artifacts/ci/e2e-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  e2e-summary:
    name: E2E / ${{ matrix.group }}
    needs: [select, e2e]
    if: ${{ !cancelled() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        group: [identity, acquisition, actions, public, invoices]
    steps:
      - name: Require every selected E2E leaf
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.e2e != '[]' }}
          RESULT: ${{ needs.e2e.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi

  emdash-cases:
    # Own stacks, own synthetic seed: no prepared fixture needed. No workflow
    # path filters: tools/ci/select_suites.py selects these for EmDash inputs
    # and every shared Core, proxy or public change; the queue runs them all.
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.emdash != '[]' && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: EmDash proof / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each case runs once; tools/ci/emdash.sh never retries a failure.
        # Groups: tools/ci/select_suites.py EMDASH_GROUPS.
        group: ${{ fromJSON(needs.select.outputs.emdash) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/emdash-${{ matrix.group }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.group == 'static' && 'toolchains' || 'browser' }}
          targets: emdash
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        env:
          EMDASH_GROUP: ${{ matrix.group }}
        run: |
          case "$EMDASH_GROUP" in
            static) sh tools/ci/retry-infra.sh ./leonaid bootstrap ;;
            *) sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh browser ;;
          esac
      - name: Run EmDash proof cases
        env:
          EMDASH_GROUP: ${{ matrix.group }}
        run: bash tools/ci/run-job.sh "emdash-$EMDASH_GROUP" sh tools/ci/emdash.sh "$EMDASH_GROUP"
      - name: Publish EmDash proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-emdash-${{ matrix.group }}
          path: .artifacts/ci/emdash-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 14

  emdash-proofs:
    name: EmDash proofs
    needs: [select, emdash-cases]
    if: ${{ !cancelled() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected EmDash proof group
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.emdash != '[]' }}
          RESULT: ${{ needs.emdash-cases.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi

  security:
    needs: fixture
    if: ${{ !cancelled() && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/security
      LEONAID_CI_DISK_REPORT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report runner disk at job start
        run: sh tools/ci/disk-report.sh "job start"
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Report runner disk after preparation
        run: sh tools/ci/disk-report.sh "prepared"
      - name: Run policies, secret scan and critical vulnerability gates
        run: bash tools/ci/run-job.sh security bash tools/ci/security.sh
      - name: Report runner disk at job end
        if: always()
        run: sh tools/ci/disk-report.sh "job end"
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-security
          path: .artifacts/ci/security
          if-no-files-found: error
          retention-days: 14

  build:
    if: github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
          targets: build
          write: "true"
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Build the canonical Compose application
        run: bash tools/ci/run-job.sh build bash tools/ci/build.sh
      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build
          path: .artifacts/ci/build
          if-no-files-found: error
          retention-days: 14

  golden-parts:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.golden == 'true' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Golden installation / ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [primary, repeat]
    env:
      LEONAID_GOLDEN_PART: ${{ matrix.part }}
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/golden-${{ matrix.part }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: browser
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh browser
      - name: Use prepared synthetic data for the functional rounds
        if: matrix.part == 'primary' && inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Run complete cross-browser Golden Journey
        run: |
          if [ "$LEONAID_GOLDEN_PART" = primary ] && [ -n "${LEONAID_CI_FIXTURE:-}" ]; then
            bash tools/ci/run-job.sh golden-journey python3 tools/testing/shared_stack.py golden tools/golden_journey/test.sh
          else
            bash tools/ci/run-job.sh golden-journey ./leonaid test-golden-journey
          fi
      - name: Publish Golden Journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-golden-${{ matrix.part }}
          path: .artifacts/ci/golden-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 14

  golden-journey:
    name: Golden journey
    needs: [select, golden-parts]
    if: ${{ !cancelled() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both independent installations
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.golden == 'true' }}
          RESULT: ${{ needs.golden-parts.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.select.outputs.golden == 'true'
        with:
          pattern: ci-golden-*
          path: comparison
      - name: Compare deterministic first-round results
        if: needs.select.outputs.golden == 'true'
        run: |
          test "$(wc -c < comparison/ci-golden-primary/comparison.txt)" -eq 65
          test "$(wc -c < comparison/ci-golden-repeat/comparison.txt)" -eq 65
          cmp comparison/ci-golden-primary/comparison.txt comparison/ci-golden-repeat/comparison.txt

  gate:
    # The one required check of this workflow (branch protection and merge
    # queue). tools/ci/gate.py: selected jobs succeeded, unselected ones were
    # skipped, everything else succeeded.
    name: CI gate
    needs:
      - select
      - fixture
      - lint-types
      - unit
      - integration-shards
      - integration
      - contract
      - e2e
      - e2e-summary
      - emdash-cases
      - emdash-proofs
      - security
      - build
      - golden-parts
      - golden-journey
    if: ${{ always() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          COLD_RUN: ${{ inputs.cold_run == true }}
        # A cold run rebuilds everything and deliberately skips the fixture.
        run: |
          set -- --name "CI gate" \
            --selectable integration-shards=integration \
            --selectable contract=contract \
            --selectable e2e=e2e \
            --selectable emdash-cases=emdash \
            --selectable golden-parts=golden
          if [ "$COLD_RUN" = true ]; then set -- "$@" --may-skip fixture; fi
          python3 tools/ci/gate.py "$@"

  flake-summary:
    # Nightly only: which jobs failed or needed a rerun across recent runs.
    name: Flake summary
    needs: gate
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Summarize failed and rerun jobs of recent runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/flake_summary.py
          --repository "$GITHUB_REPOSITORY"
          --workflow ci.yml --workflow surveys.yml
          --runs 50

  pilot-cold-rehearsal:
    if: inputs.cold_run == true && inputs.artifact_probe != true
    name: Pilot cold rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/pilot-cold-rehearsal
      LEONAID_PILOT_REHEARSAL_ARTIFACT_DIR: .artifacts/ci/pilot-cold-rehearsal/rehearsal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove empty Docker state without caches
        run: docker system prune --all --volumes --force
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run complete synthetic pilot rehearsal from empty state
        run: >-
          bash tools/ci/run-job.sh
          pilot-cold-rehearsal
          ./leonaid test-pilot-rehearsal --synthetic
      - name: Publish sanitized cold-rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-pilot-cold-rehearsal
          path: .artifacts/ci/pilot-cold-rehearsal
          if-no-files-found: error
          retention-days: 14

  artifact-probe:
    if: github.ref == 'refs/heads/ci-artifact-probe' || inputs.artifact_probe == true
    name: Artifact probe
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/artifact-probe
      LEONAID_TESTKIT_E2E_SPEC: ci-artifact-probe.spec.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap locked Docker toolchains
        run: ./leonaid bootstrap
      - name: Run intentionally failing real-stack browser probe
        run: bash tools/ci/run-job.sh artifact-probe ./leonaid test-testkit
      - name: Publish failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-probe
          path: .artifacts/ci/artifact-probe
          if-no-files-found: error
          retention-days: 14
