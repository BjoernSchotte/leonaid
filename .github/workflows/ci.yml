name: LeonAid CI
# The nightly run has every E2E leaf; its own name lets nightly-watchdog.yml
# track it apart from the post-merge runs.
run-name: ${{ github.event.schedule == '7 3 * * *' && 'LeonAid CI nightly (every E2E leaf)' || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'LeonAid CI post-merge' || github.event.pull_request.title || github.workflow }}

on:
  # Fast tier (decision E-018): the required gate in about five minutes;
  # browser and acceptance suites run after the merge.
  pull_request:
    # Drafts run nothing (their gate fails); ready_for_review starts CI,
    # converted_to_draft cancels the running one. edited: a base change (a
    # stacked PR retargeted to main) runs the normal selection; a title or
    # body edit runs no job and its gate mirrors the commit's real result.
    # labeled: adding full-ci runs the complete suite now; any other label
    # change mirrors like a title edit.
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
        labeled,
        unlabeled,
      ]
  # Post-merge tier: every push to main runs the suites of the paths changed
  # since the last green run there; every post-merge run finishes (E-019),
  # GitHub keeps only the newest pending one;
  # nightly-watchdog.yml opens an issue when one is red.
  push:
    branches:
      - main
  # Nightly complete run.
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leonaid-ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}${{ ((github.event.action == 'edited' && !github.event.changes.base) || (github.event.action == 'labeled' && github.event.label.name != 'full-ci') || github.event.action == 'unlabeled' || (github.event.pull_request.draft && github.event.action != 'converted_to_draft')) && format('-mirror-{0}', github.run_id) || '' }}
  # A new push supersedes a pull request's run. Post-merge runs on main are
  # never cancelled (E-019): the running one finishes, GitHub keeps the
  # newest pending one, and that one diffs since the last green run, so the
  # dropped pending runs lose nothing. The nightly run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled'
    uses: ./.github/workflows/select-suites.yml
    # actions: read finds the last green run on main for the post-merge diff.
    permissions:
      actions: read
      contents: read
    with:
      post-merge: true

  hold:
    # Adding full-ci: the gate turns red on the head commit at once, so the
    # green fast gate cannot be merged while the complete run is pending;
    # only that run's gate (or a later push's) replaces it (E-019,
    # tools/ci/hold_gate.py).
    if: github.event.action == 'labeled' && github.event.label.name == 'full-ci' && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled'
    name: Hold the gate for full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Put a red gate on the head commit until the complete run reports
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_NAME: CI gate
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci/hold_gate.py

  fixture:
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled'
    uses: ./.github/workflows/test-fixture.yml
    # A called workflow may not request more than its caller grants
    # (select-suites.yml and test-fixture.yml read the Actions API).
    permissions:
      actions: read
      contents: read

  lint:
    # Stack-free: three parallel lanes inside tools/ci/lint-types.sh.
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled'
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run lint, type and contract-generation checks
        run: bash tools/ci/run-job.sh lint-types bash tools/ci/lint-types.sh
      - name: Publish lint and type evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lint
          path: .artifacts/ci/lint
          if-no-files-found: error
          retention-days: 14

  unit:
    # Stack-free: the exhaustive disclosure solver proof is spread over
    # parallel pytest processes beside the other unit tests (tools/ci/unit.sh).
    if: github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled'
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/unit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run unit tests with real domain objects
        run: bash tools/ci/run-job.sh unit sh tools/ci/unit.sh
      - name: Publish unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-unit
          path: .artifacts/ci/unit
          if-no-files-found: error
          retention-days: 14

  integration-shards:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.integration != '[]' && needs.fixture.result == 'success' }}
    # Stable leg names; shards: job summary.
    name: Integration ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Bins of selected shards (and Contract), longest first:
        # tools/ci/select_suites.py INTEGRATION_SECONDS and pack().
        bin: ${{ fromJSON(needs.select.outputs.integration) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/integration-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "2400"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
      - name: Use prepared synthetic data
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### Integration leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run real service integration shards
        env:
          SHARDS: ${{ matrix.bin.shards }}
        # One word per shard; every shard runs on its own fresh stack.
        run: bash tools/ci/run-job.sh "integration-${{ matrix.bin.id }}" bash tools/ci/integration.sh $SHARDS
      - name: Publish integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integration-${{ matrix.bin.id }}
          path: .artifacts/ci/integration-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.e2e != '[]' && needs.fixture.result == 'success' }}
    name: E2E ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Bins of selected leaves, longest first: tools/ci/select_suites.py
        # E2E_SECONDS and pack(); tools/ci/e2e.sh runs them per fixture kind.
        bin: ${{ fromJSON(needs.select.outputs.e2e) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/e2e-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "5100"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
      - name: Use prepared synthetic data
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### E2E leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run real browser leaves
        env:
          SHARDS: ${{ matrix.bin.shards }}
        # One word per shard.
        run: bash tools/ci/run-job.sh "e2e-${{ matrix.bin.id }}" bash tools/ci/e2e.sh $SHARDS
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-${{ matrix.bin.id }}
          path: .artifacts/ci/e2e-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  emdash-cases:
    # Own stacks, own synthetic seed: no prepared fixture needed. No workflow
    # path filters: tools/ci/select_suites.py selects these for EmDash inputs
    # and every shared Core, proxy or public change; the queue runs them all.
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.emdash != '[]' }}
    name: EmDash proof ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each case runs once; tools/ci/emdash.sh never retries a failure.
        # Bins of groups: tools/ci/select_suites.py EMDASH_BINS.
        bin: ${{ fromJSON(needs.select.outputs.emdash) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/emdash-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "3300"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
          targets: emdash
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### EmDash leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run EmDash proof cases
        env:
          EMDASH_ID: ${{ matrix.bin.id }}
          EMDASH_GROUPS: ${{ matrix.bin.shards }}
        # One word per group.
        run: bash tools/ci/run-job.sh "emdash-$EMDASH_ID" sh tools/ci/emdash.sh $EMDASH_GROUPS
      - name: Publish EmDash proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-emdash-${{ matrix.bin.id }}
          path: .artifacts/ci/emdash-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  vulnerability:
    # Skipped only in a stacked pull request (selector output heavy=false).
    # Builds every own image and scans it, the checkout, both lockfiles and
    # every pinned third-party image (tools/security/vulnerability-scan.sh).
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.heavy != 'false' }}
    name: Vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/vulnerability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
          # Every own image, the campaign site included.
          targets: build
          # vulnerability-scan.sh reuses shared tags (prebuilt_images.py adopt).
          # Kill switch for every prebuilt pull: repository variable
          # CI_PREBUILT_IMAGES=off (decision E-020).
          prebuilt: ${{ vars.CI_PREBUILT_IMAGES != 'off' }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run the HIGH/CRITICAL vulnerability gate
        run: bash tools/ci/run-job.sh vulnerability sh tools/security/vulnerability-scan.sh
      - name: Publish vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-vulnerability
          path: .artifacts/ci/vulnerability
          if-no-files-found: error
          retention-days: 14

  security:
    # Skipped only in a stacked pull request (selector output heavy=false).
    # Policy self-tests and the secret scan beside the security stack test;
    # the image gate is the vulnerability job.
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.heavy != 'false' && needs.fixture.result == 'success' }}
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
          # The stack test borrows a shared_stack.py stack (shared tags).
          prebuilt: ${{ vars.CI_PREBUILT_IMAGES != 'off' }}
      - name: Use prepared synthetic data
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run policies, secret scan and the security stack test
        run: bash tools/ci/run-job.sh security bash tools/ci/security.sh
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-security
          path: .artifacts/ci/security
          if-no-files-found: error
          retention-days: 14

  build:
    # Skipped only in a stacked pull request (selector output heavy=false).
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.heavy != 'false' }}
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Small AWS runners start with about 14 GB free; all application images
      # (each with the workspace's production node_modules) need more.
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
          targets: build
          # Cache write discipline: only runs on main (every post-merge push,
          # the nightly run and a dispatch on main) write the shared BuildKit
          # cache, which every pull request imports; writing after each merge
          # is intended, it keeps the PR imports current. Pull requests and bot dispatches on other
          # branches (ci/refit-timings, pins/repin-images) only read: their
          # layers would evict main's from the 10 GB budget.
          write: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'true' || 'false' }}
          # tools/ci/build.sh reuses shared tags; a cache write bakes all.
          prebuilt: ${{ vars.CI_PREBUILT_IMAGES != 'off' }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Build the canonical Compose application
        run: bash tools/ci/run-job.sh build bash tools/ci/build.sh
      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build
          path: .artifacts/ci/build
          if-no-files-found: error
          retention-days: 14

  publish-images:
    # Prebuilt CI images (decision E-020): only runs on main publish, after a
    # green Build; pull requests only pull (.github/actions/build-cache). Each
    # image whose content-hash tag is missing is pushed after the secret
    # check. The Monday nightly rebuilds and republishes every image without
    # the layer cache, so OS packages stay current; CI has no image age limit.
    needs: [select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CI_PREBUILT_IMAGES != 'off' }}
    name: Publish prebuilt images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # packages: write only here and in release.yml (test_workflow_files.py).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Log in to the GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Choose the images to publish
        id: plan
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 1 ]; then
            echo "uncached=true" >> "$GITHUB_OUTPUT"
            python3 -I tools/ci/prebuilt_images.py plan --all build
          else
            python3 -I tools/ci/prebuilt_images.py plan build
          fi
      - id: builder
        if: steps.plan.outputs.targets != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cleanup: false
      - name: Build the images with the hash label
        if: steps.plan.outputs.targets != ''
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CACHE_WRITE: "false"
          CACHE_READ: "true"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          source: .
          files: |
            tools/ci/docker-bake.hcl
            ${{ steps.plan.outputs.override }}
          targets: ${{ steps.plan.outputs.targets }}
          load: true
          no-cache: ${{ steps.plan.outputs.uncached == 'true' }}
          github-token: ${{ github.token }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Check each image for secrets and push it
        if: steps.plan.outputs.targets != ''
        env:
          OVERRIDE: ${{ steps.plan.outputs.override }}
        run: python3 -I tools/ci/prebuilt_images.py publish "$OVERRIDE"
      - name: Remove the registry login
        if: always()
        run: docker logout ghcr.io

  golden-parts:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.golden == 'true' && needs.fixture.result == 'success' }}
    name: Golden installation / ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [primary, repeat]
    env:
      LEONAID_GOLDEN_PART: ${{ matrix.part }}
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/golden-${{ matrix.part }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Reuse persistent Docker build layers
        uses: ./.github/actions/build-cache
        with:
          bootstrap: browser
      - name: Use prepared synthetic data for the functional rounds
        if: matrix.part == 'primary'
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run complete cross-browser Golden Journey
        run: |
          if [ "$LEONAID_GOLDEN_PART" = primary ] && [ -n "${LEONAID_CI_FIXTURE:-}" ]; then
            bash tools/ci/run-job.sh golden-journey python3 tools/testing/shared_stack.py golden tools/golden_journey/test.sh
          else
            bash tools/ci/run-job.sh golden-journey ./leonaid test-golden-journey
          fi
      - name: Publish Golden Journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-golden-${{ matrix.part }}
          path: .artifacts/ci/golden-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 14

  golden-journey:
    name: Golden journey
    needs: [select, golden-parts]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.event.action != 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both independent installations
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.golden == 'true' }}
          RESULT: ${{ needs.golden-parts.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.select.outputs.golden == 'true'
        with:
          pattern: ci-golden-*
          path: comparison
      - name: Compare deterministic first-round results
        if: needs.select.outputs.golden == 'true'
        run: |
          test "$(wc -c < comparison/ci-golden-primary/comparison.txt)" -eq 65
          test "$(wc -c < comparison/ci-golden-repeat/comparison.txt)" -eq 65
          cmp comparison/ci-golden-primary/comparison.txt comparison/ci-golden-repeat/comparison.txt

  gate:
    # The one required check of this workflow (repository ruleset).
    # tools/ci/gate.py: selected jobs succeeded, unselected ones were
    # skipped, everything else succeeded.
    name: CI gate
    needs:
      - select
      - fixture
      - lint
      - unit
      - integration-shards
      - e2e
      - emdash-cases
      - security
      - vulnerability
      - build
      - golden-parts
      - golden-journey
    if: ${{ always() }}
    permissions:
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Pull request context for tools/ci/gate.py: drafts fail, title
          # edits mirror the commit's newest completed real gate (or fail
          # fast), a stacked result never passes.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ toJSON(github.event.changes.base) != 'null' }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_BASE: ${{ github.base_ref }}
          GATE_NAME: CI gate
          # A fast run never satisfies the gate while the PR carries full-ci.
          FULL_CI_GATE: "true"
        run: |
          set -- --name "CI gate" \
            --selectable integration-shards=integration \
            --selectable e2e=e2e \
            --selectable emdash-cases=emdash \
            --selectable golden-parts=golden \
            --selectable security=heavy \
            --selectable vulnerability=heavy \
            --selectable build=heavy
          python3 tools/ci/gate.py "$@"
