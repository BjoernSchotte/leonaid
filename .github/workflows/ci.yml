name: LeonAid CI
# The nightly run is the only scheduled run with every E2E leaf; its own
# name lets nightly-watchdog.yml track it apart from the 3-hourly runs.
run-name: ${{ github.event.schedule == '7 3 * * *' && 'LeonAid CI nightly (every E2E leaf)' || github.event.schedule == '37 */3 * * *' && 'LeonAid CI main every 3 hours' || github.event.pull_request.title || github.workflow }}

on:
  # PR tier: cheap gates plus only the stack suites whose inputs changed.
  pull_request:
    # Drafts run nothing (their gate fails); ready_for_review starts CI,
    # converted_to_draft cancels the running one. edited: a base change (a
    # stacked PR retargeted to main) runs the normal selection; a title or
    # body edit runs no job and its gate mirrors the commit's real result.
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        edited,
      ]
  # No full run per push to main (decision 2026-11-07): main is proven by
  # the scheduled complete runs below; nightly-watchdog.yml opens an issue
  # when one is red. Only the artifact probe branch still runs on push.
  push:
    branches:
      - ci-artifact-probe
  # Nightly complete run with the flake summary (7 3), and a complete run
  # on main every 3 hours (37 */3).
  schedule:
    - cron: "7 3 * * *"
    - cron: "37 */3 * * *"
  workflow_dispatch:
    inputs:
      cold_run:
        description: Remove the ephemeral runner's Docker build cache first
        required: false
        type: boolean
        default: false
      artifact_probe:
        description: Run the intentionally failing artifact proof only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: leonaid-ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  # A new push supersedes a pull request's run; scheduled runs on main are
  # never cancelled by the next one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    if: inputs.artifact_probe != true && github.ref != 'refs/heads/ci-artifact-probe' && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base)
    uses: ./.github/workflows/select-suites.yml

  fixture:
    if: inputs.cold_run != true && inputs.artifact_probe != true && github.ref != 'refs/heads/ci-artifact-probe' && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base)
    uses: ./.github/workflows/test-fixture.yml

  lint-unit:
    # One runner for the two stack-free gates: both need only the locked
    # toolchains, and a second job would repeat checkout and bootstrap.
    if: github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base)
    name: Lint, types and unit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Run lint, type and contract-generation checks
        env:
          LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/lint-unit/lint-types
        run: bash tools/ci/run-job.sh lint-types bash tools/ci/lint-types.sh
      # Runs after a lint failure too, so one run reports both gates.
      - name: Run unit tests with real domain objects
        if: ${{ !cancelled() }}
        env:
          LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/lint-unit/unit
        run: bash tools/ci/run-job.sh unit ./leonaid test-unit
      - name: Publish lint, type and unit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lint-unit
          path: .artifacts/ci/lint-unit
          if-no-files-found: error
          retention-days: 14

  integration-shards:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.integration != '[]' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    # Stable names keep the flake history comparable; shards: job summary.
    name: Integration ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Bins of selected shards (and Contract), longest first:
        # tools/ci/select_suites.py INTEGRATION_SECONDS and pack().
        bin: ${{ fromJSON(needs.select.outputs.integration) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/integration-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "2400"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        env:
          BOOTSTRAP_PROFILE: ${{ matrix.bin.bootstrap }}
        run: sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh "$BOOTSTRAP_PROFILE"
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### Integration leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start sampling peak runner disk
        run: sh tools/ci/disk-peak.sh start
      - name: Run real service integration shards
        env:
          SHARDS: ${{ matrix.bin.shards }}
        # One word per shard; every shard runs on its own fresh stack.
        run: bash tools/ci/run-job.sh "integration-${{ matrix.bin.id }}" bash tools/ci/integration.sh $SHARDS
      - name: Report peak runner disk of this leg
        # Data for the free-runner-disk.sh skip threshold (40 GB).
        if: always()
        run: |
          sh tools/ci/disk-peak.sh stop
          sh tools/ci/disk-report.sh "job end"
      - name: Publish integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integration-${{ matrix.bin.id }}
          path: .artifacts/ci/integration-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.e2e != '[]' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: E2E ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Bins of selected leaves, longest first: tools/ci/select_suites.py
        # E2E_SECONDS and pack(); tools/ci/e2e.sh runs them per fixture kind.
        bin: ${{ fromJSON(needs.select.outputs.e2e) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/e2e-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "5100"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh browser
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### E2E leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start sampling peak runner disk
        run: sh tools/ci/disk-peak.sh start
      - name: Run real browser leaves
        env:
          SHARDS: ${{ matrix.bin.shards }}
        # One word per shard.
        run: bash tools/ci/run-job.sh "e2e-${{ matrix.bin.id }}" bash tools/ci/e2e.sh $SHARDS
      - name: Report peak runner disk of this leg
        # Data for the free-runner-disk.sh skip threshold (40 GB).
        if: always()
        run: |
          sh tools/ci/disk-peak.sh stop
          sh tools/ci/disk-report.sh "job end"
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-${{ matrix.bin.id }}
          path: .artifacts/ci/e2e-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  emdash-cases:
    # Own stacks, own synthetic seed: no prepared fixture needed. No workflow
    # path filters: tools/ci/select_suites.py selects these for EmDash inputs
    # and every shared Core, proxy or public change; the queue runs them all.
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.emdash != '[]' && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: EmDash proof ${{ matrix.bin.id }}/${{ matrix.bin.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each case runs once; tools/ci/emdash.sh never retries a failure.
        # Bins of groups: tools/ci/select_suites.py EMDASH_BINS.
        bin: ${{ fromJSON(needs.select.outputs.emdash) }}
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/emdash-${{ matrix.bin.id }}
      # Stops the suite 5 minutes before timeout-minutes, so the evidence
      # is still collected and uploaded (tools/ci/capture-command.sh).
      LEONAID_CI_STEP_SECONDS: "3300"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: ${{ matrix.bin.bootstrap }}
          targets: emdash
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        env:
          BOOTSTRAP_PROFILE: ${{ matrix.bin.bootstrap }}
        run: sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh "$BOOTSTRAP_PROFILE"
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: List this leg's shards in the job summary
        env:
          SHARDS: ${{ matrix.bin.title }}
        run: printf '### EmDash leg ${{ matrix.bin.id }}/${{ matrix.bin.count }}\n\n%s\n' "$SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start sampling peak runner disk
        run: sh tools/ci/disk-peak.sh start
      - name: Run EmDash proof cases
        env:
          EMDASH_ID: ${{ matrix.bin.id }}
          EMDASH_GROUPS: ${{ matrix.bin.shards }}
        # One word per group.
        run: bash tools/ci/run-job.sh "emdash-$EMDASH_ID" sh tools/ci/emdash.sh $EMDASH_GROUPS
      - name: Report peak runner disk of this leg
        # Data for the free-runner-disk.sh skip threshold (40 GB).
        if: always()
        run: |
          sh tools/ci/disk-peak.sh stop
          sh tools/ci/disk-report.sh "job end"
      - name: Publish EmDash proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-emdash-${{ matrix.bin.id }}
          path: .artifacts/ci/emdash-${{ matrix.bin.id }}
          if-no-files-found: error
          retention-days: 14

  security:
    # Skipped only in a stacked pull request (selector output heavy=false).
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.heavy != 'false' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/security
      LEONAID_CI_DISK_REPORT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report runner disk at job start
        run: sh tools/ci/disk-report.sh "job start"
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Use prepared synthetic data
        if: inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Report runner disk after preparation
        run: sh tools/ci/disk-report.sh "prepared"
      - name: Run policies, secret scan and critical vulnerability gates
        run: bash tools/ci/run-job.sh security bash tools/ci/security.sh
      - name: Report runner disk at job end
        if: always()
        run: sh tools/ci/disk-report.sh "job end"
      - name: Publish security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-security
          path: .artifacts/ci/security
          if-no-files-found: error
          retention-days: 14

  build:
    # Skipped only in a stacked pull request (selector output heavy=false).
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.heavy != 'false' && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Small AWS runners start with about 14 GB free; all application images
      # (each with the workspace's production node_modules) need more.
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: toolchains
          targets: build
          # Cache write discipline: only the scheduled runs on main (and
          # dispatch) write the shared BuildKit cache, which every pull
          # request imports. A pull request's layers would only live in its
          # own cache scope and evict main's layers from the 10 GB budget.
          write: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Build the canonical Compose application
        run: bash tools/ci/run-job.sh build bash tools/ci/build.sh
      - name: Publish build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-build
          path: .artifacts/ci/build
          if-no-files-found: error
          retention-days: 14

  golden-parts:
    needs: [select, fixture]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.golden == 'true' && (needs.fixture.result == 'success' || inputs.cold_run == true) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    name: Golden installation / ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [primary, repeat]
    env:
      LEONAID_GOLDEN_PART: ${{ matrix.part }}
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/golden-${{ matrix.part }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prepare empty-cache runner
        if: inputs.cold_run == true
        run: docker builder prune --all --force
      - name: Reuse persistent Docker build layers
        if: inputs.cold_run != true
        uses: ./.github/actions/build-cache
        with:
          bootstrap: browser
      - name: Bootstrap locked Docker toolchains
        if: inputs.cold_run == true
        run: sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh browser
      - name: Use prepared synthetic data for the functional rounds
        if: matrix.part == 'primary' && inputs.cold_run != true
        uses: ./.github/actions/test-fixture
        with:
          key: ${{ needs.fixture.outputs.key }}
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run complete cross-browser Golden Journey
        run: |
          if [ "$LEONAID_GOLDEN_PART" = primary ] && [ -n "${LEONAID_CI_FIXTURE:-}" ]; then
            bash tools/ci/run-job.sh golden-journey python3 tools/testing/shared_stack.py golden tools/golden_journey/test.sh
          else
            bash tools/ci/run-job.sh golden-journey ./leonaid test-golden-journey
          fi
      - name: Publish Golden Journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-golden-${{ matrix.part }}
          path: .artifacts/ci/golden-${{ matrix.part }}
          if-no-files-found: error
          retention-days: 14

  golden-journey:
    name: Golden journey
    needs: [select, golden-parts]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (github.event.action != 'edited' || github.event.changes.base) && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both independent installations
        env:
          SELECT: ${{ needs.select.result }}
          SELECTED: ${{ needs.select.outputs.golden == 'true' }}
          RESULT: ${{ needs.golden-parts.result }}
        # Unselected suites must be skipped, selected ones must succeed.
        run: |
          test "$SELECT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.select.outputs.golden == 'true'
        with:
          pattern: ci-golden-*
          path: comparison
      - name: Compare deterministic first-round results
        if: needs.select.outputs.golden == 'true'
        run: |
          test "$(wc -c < comparison/ci-golden-primary/comparison.txt)" -eq 65
          test "$(wc -c < comparison/ci-golden-repeat/comparison.txt)" -eq 65
          cmp comparison/ci-golden-primary/comparison.txt comparison/ci-golden-repeat/comparison.txt

  gate:
    # The one required check of this workflow (repository ruleset).
    # tools/ci/gate.py: selected jobs succeeded, unselected ones were
    # skipped, everything else succeeded.
    name: CI gate
    needs:
      - select
      - fixture
      - lint-unit
      - integration-shards
      - e2e
      - emdash-cases
      - security
      - build
      - golden-parts
      - golden-journey
    if: ${{ always() && github.ref != 'refs/heads/ci-artifact-probe' && inputs.artifact_probe != true }}
    permissions:
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Pull request context for tools/ci/gate.py: drafts fail, title
          # edits mirror the commit's newest completed real gate (or fail
          # fast), a stacked result never passes.
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ toJSON(github.event.changes.base) != 'null' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STACK_BASE: ${{ github.base_ref }}
          GATE_NAME: CI gate
          COLD_RUN: ${{ inputs.cold_run == true }}
        # A cold run rebuilds everything and deliberately skips the fixture.
        run: |
          set -- --name "CI gate" \
            --selectable integration-shards=integration \
            --selectable e2e=e2e \
            --selectable emdash-cases=emdash \
            --selectable golden-parts=golden \
            --selectable security=heavy \
            --selectable build=heavy
          if [ "$COLD_RUN" = true ]; then set -- "$@" --may-skip fixture; fi
          python3 tools/ci/gate.py "$@"

  flake-summary:
    # Nightly only: which jobs failed or needed a rerun across recent runs.
    name: Flake summary
    needs: gate
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '7 3 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
      - name: Summarize failed and rerun jobs of recent runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/flake_summary.py
          --repository "$GITHUB_REPOSITORY"
          --workflow ci.yml --workflow surveys.yml
          --runs 50

  pilot-cold-rehearsal:
    if: inputs.cold_run == true && inputs.artifact_probe != true
    name: Pilot cold rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/pilot-cold-rehearsal
      LEONAID_PILOT_REHEARSAL_ARTIFACT_DIR: .artifacts/ci/pilot-cold-rehearsal/rehearsal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start freeing runner disk from unused toolchains
        run: sh tools/ci/free-runner-disk.sh start
      - name: Prove empty Docker state without caches
        run: docker system prune --all --volumes --force
      - name: Bootstrap locked Docker toolchains
        run: sh tools/ci/retry-infra.sh ./leonaid bootstrap
      - name: Finish freeing runner disk
        run: sh tools/ci/free-runner-disk.sh wait
      - name: Run complete synthetic pilot rehearsal from empty state
        run: >-
          bash tools/ci/run-job.sh
          pilot-cold-rehearsal
          ./leonaid test-pilot-rehearsal --synthetic
      - name: Publish sanitized cold-rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-pilot-cold-rehearsal
          path: .artifacts/ci/pilot-cold-rehearsal
          if-no-files-found: error
          retention-days: 14

  artifact-probe:
    if: github.ref == 'refs/heads/ci-artifact-probe' || inputs.artifact_probe == true
    name: Artifact probe
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LEONAID_CI_ARTIFACT_DIR: .artifacts/ci/artifact-probe
      LEONAID_TESTKIT_E2E_SPEC: ci-artifact-probe.spec.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap locked Docker toolchains
        run: ./leonaid bootstrap
      - name: Run intentionally failing real-stack browser probe
        run: bash tools/ci/run-job.sh artifact-probe ./leonaid test-testkit
      - name: Publish failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-probe
          path: .artifacts/ci/artifact-probe
          if-no-files-found: error
          retention-days: 14
