name: Import synthetic test fixture
description: Restore a checked template; tests copy it into individually owned volumes
inputs:
  key:
    description: Exact prepared fixture key; fallback keys are forbidden
    required: true
runs:
  using: composite
  steps:
    # GitHub cache downloads fail transiently (429, 5xx). The first attempt
    # may fail; the retry below then decides the job. A truly missing key
    # fails both attempts.
    - id: restore
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/leonaid-synthetic-fixture
        key: ${{ inputs.key }}
        fail-on-cache-miss: true
    - name: Back off before retrying the fixture download
      if: steps.restore.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Infrastructure retry::Fixture cache restore failed; retrying once in 30s"
        rm -rf "$RUNNER_TEMP/leonaid-synthetic-fixture"
        sleep 30
    - name: Retry fixture download
      if: steps.restore.outcome == 'failure'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/leonaid-synthetic-fixture
        key: ${{ inputs.key }}
        fail-on-cache-miss: true
    - name: Validate fixture and select its synthetic environment
      shell: bash
      run: python3 tools/testing/ci_fixture.py activate "$RUNNER_TEMP/leonaid-synthetic-fixture"
