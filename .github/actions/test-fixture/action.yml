name: Import synthetic test fixture
description: Restore a checked template; tests copy it into individually owned volumes
inputs:
  key:
    description: Exact prepared fixture key; fallback keys are forbidden
    required: true
runs:
  using: composite
  steps:
    - id: cached
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/leonaid-synthetic-fixture
        key: ${{ inputs.key }}
        fail-on-cache-miss: false
    - name: Validate fixture and select its synthetic environment
      shell: bash
      env:
        FIXTURE_CACHE_HIT: ${{ steps.cached.outputs.cache-hit }}
        FIXTURE_KEY: ${{ inputs.key }}
      run: |
        test "$FIXTURE_KEY" = "fixture-v1-$(python3 tools/testing/ci_fixture.py key)"
        directory="$RUNNER_TEMP/leonaid-synthetic-fixture"
        if [ "$FIXTURE_CACHE_HIT" != true ]; then
          directory="$RUNNER_TEMP/leonaid-synthetic-fixture-rebuilt"
          python3 tools/testing/ci_fixture.py build "$directory"
        fi
        python3 tools/testing/ci_fixture.py activate "$directory"
