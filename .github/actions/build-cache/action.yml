name: Warm Docker build cache
description: Import persistent BuildKit layers into this job's builder without sharing runtime state
inputs:
  bootstrap:
    description: Optional toolchains, seed or browser bootstrap overlapping cache import
    default: ""
  targets:
    description: Bake target or group
    default: default
  namespace:
    description: Cache namespace; target and architecture are appended
    default: leonaid-build-v1
  write:
    description: Only the designated Build job exports the normal cache
    default: "false"
runs:
  using: composite
  steps:
    - name: Start independent toolchain and image preparation
      id: bootstrap
      if: inputs.bootstrap != ''
      shell: bash
      env:
        BOOTSTRAP_PROFILE: ${{ inputs.bootstrap }}
      run: |
        directory=$(mktemp -d "$RUNNER_TEMP/leonaid-bootstrap.XXXXXX")
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
        nohup sh -c '
          status=0
          sh tools/ci/retry-infra.sh sh tools/ci/bootstrap-prefetch.sh "$1" > "$2/log" 2>&1 || status=$?
          printf "%s\n" "$status" > "$2/status"
        ' bootstrap "$BOOTSTRAP_PROFILE" "$directory" </dev/null >/dev/null 2>&1 &
    - id: builder
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        # The runner is discarded after the job; removing the builder and
        # its volume in the post step cost 30-110 s per job (run 42468977036).
        cleanup: false
    - name: Select the same builder for subsequent Compose calls
      shell: bash
      env:
        CACHE_BUILDER: ${{ steps.builder.outputs.name }}
      run: |
        echo "BUILDX_BUILDER=$CACHE_BUILDER" >> "$GITHUB_ENV"
        echo "DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}" >> "$GITHUB_ENV"
    # GitHub cache (429) and registry errors are transient. The first
    # attempt may fail; the retry below then decides the job. A real
    # Dockerfile error fails both attempts.
    - name: Import layers and build requested images
      id: bake
      continue-on-error: true
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      env:
        CACHE_NAMESPACE: ${{ inputs.namespace }}
        CACHE_WRITE: ${{ inputs.write }}
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        # No build-record export and job summary in the post step.
        DOCKER_BUILD_SUMMARY: "false"
      with:
        source: .
        files: tools/ci/docker-bake.hcl
        targets: ${{ inputs.targets }}
        # Materialize imported layers: cache-only warm-up showed cache misses
        # in subsequent Compose builds in CI. Discard the OCI archive; only
        # the actual harness loads runtime images into the Docker daemon.
        set: "*.output=type=oci,dest=/dev/null"
        github-token: ${{ github.token }}
    - name: Back off before retrying the cache import
      if: steps.bake.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Infrastructure retry::Docker bake/cache import failed; retrying once in 30s"
        sleep 30
    - name: Retry layer import and image build
      if: steps.bake.outcome == 'failure'
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      env:
        CACHE_NAMESPACE: ${{ inputs.namespace }}
        CACHE_WRITE: ${{ inputs.write }}
        DOCKER_BUILD_RECORD_UPLOAD: "false"
        # No build-record export and job summary in the post step.
        DOCKER_BUILD_SUMMARY: "false"
      with:
        source: .
        files: tools/ci/docker-bake.hcl
        targets: ${{ inputs.targets }}
        # Materialize imported layers: cache-only warm-up showed cache misses
        # in subsequent Compose builds in CI. Discard the OCI archive; only
        # the actual harness loads runtime images into the Docker daemon.
        set: "*.output=type=oci,dest=/dev/null"
        github-token: ${{ github.token }}
    - name: Require completed toolchain and image preparation
      if: always() && steps.bootstrap.outputs.directory != ''
      shell: bash
      env:
        BOOTSTRAP_DIRECTORY: ${{ steps.bootstrap.outputs.directory }}
      run: |
        timeout 600 sh -c 'until test -f "$1/status"; do sleep 1; done' wait "$BOOTSTRAP_DIRECTORY"
        cat "$BOOTSTRAP_DIRECTORY/log"
        test "$(cat "$BOOTSTRAP_DIRECTORY/status")" = 0
